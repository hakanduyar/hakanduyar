# Regenerates data/telemetry.json and every derived output from the live
# GitHub API, then commits — but only when something the owner did changed
# (a push, new commits, a new repository, a language shift). A week where
# only the clock moved produces no commit; the sliding-window fields alone
# never trigger one. See scripts/generate/material-change.mjs.
#
# Weekly cadence. Note: GitHub disables scheduled workflows after 60 days
# without repository activity; docs/maintenance.md covers re-enabling.
name: refresh-telemetry

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC; minute chosen off the busy :00
  workflow_dispatch:
    inputs:
      allow_metric_drop:
        description: 'Accept a >50% metric decrease (repositories changed visibility, etc.)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # snapshot.ts enforces a structural sanity floor (non-zero repositories,
      # commits, languages, exactly 52 week buckets, complete featured set).
      # A structurally complete but collapsed response — the signature of a
      # token that stops seeing the contribution calendar — is caught by the
      # material-change step's collapse guard below, against the committed
      # snapshot.
      - name: Snapshot live telemetry
        env:
          # Falls back to the repo token; PROFILE_READ_TOKEN is an optional
          # fine-grained PAT for the day the repo token stops seeing the
          # contribution calendar (docs/maintenance.md).
          GITHUB_TOKEN: ${{ secrets.PROFILE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run data:snapshot

      # Exit 0 = material change; exit 3 = nothing owner-driven changed (skip);
      # anything else = real error and the job fails. A crash must never be
      # mistaken for "no change".
      # Exit 0 = commit; 3 = quiet week, skip; 4 = suspicious collapse, FAIL
      # (release a legitimate large swing by dispatching with
      # allow_metric_drop); anything else = real error, FAIL.
      - name: Detect material change
        id: material
        env:
          ALLOW_METRIC_DROP: ${{ inputs.allow_metric_drop && '1' || '0' }}
        run: |
          set +e
          node scripts/generate/material-change.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/telemetry.json
          elif [ "$code" -eq 4 ]; then
            echo "::error::Metric collapse detected - refusing to publish. Re-run with allow_metric_drop if the account really changed this much."
            exit 1
          else
            exit "$code"
          fi

      - name: Rebuild assets and README
        if: steps.material.outputs.changed == 'true'
        run: |
          npm run render
          npm run readme
          npm run docs:tokens

      - name: Verify before committing
        if: steps.material.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm test
          npm run validate

      - name: Commit refreshed telemetry
        if: steps.material.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MEASURED=$(node -p "require('./data/telemetry.json').capturedAt.slice(0,10)")
          git add data/telemetry.json assets/generated README.md docs/tokens.md
          git commit -m "chore(telemetry): refresh measured data ${MEASURED} [skip ci]" -m "Automated weekly refresh; committed only because owner-driven data changed. Fully verified (typecheck, tests, validate) before this commit."
          git push
