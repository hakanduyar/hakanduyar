name: Profile V4 integrity

on:
  pull_request:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # "Generated files are committed" (git diff --exit-code -- README.md
      # assets/generated) retired: as of V6, README.md is hand-authored
      # static content (see assets/v6/, .github/workflows/ci-v6.yml) and is
      # no longer produced by this pipeline's `npm run readme`, so the two
      # can never match again. typecheck/build/test above still guard the
      # V4/V5 source and generator logic itself.
