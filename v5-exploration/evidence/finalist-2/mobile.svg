<svg xmlns="http://www.w3.org/2000/svg" width="390" height="845" viewBox="0 0 390 845"><style>#dark,#light{display:none}#dark:target,#light:target{display:block}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.serif{font-family:Georgia,Times New Roman,serif}.mono{font-family:Consolas,monospace}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.paper{fill:var(--paper)}.wash{fill:var(--wash)}.line{stroke:var(--line)}.caps{font-weight:700;letter-spacing:1px}.hair{shape-rendering:crispEdges}</style><defs><symbol id="scene"><text x="18" y="42" class="serif ink" font-size="32">Hakan Duyar</text><text x="18" y="62" class="mono muted caps" font-size="7">ARCHITECTURE CASEBOOK / 2026</text><line x1="18" y1="76" x2="372" y2="76" class="line hair" stroke-width="3"/><text x="18" y="110" class="mono accent caps" font-size="7">ENGINEERING IDENTITY</text><text x="18" y="150" class="serif ink" font-size="31">Architecture makes</text><text x="18" y="184" class="serif ink" font-size="31">intent accountable.</text><text x="18" y="211" class="sans muted" font-size="9">React + TypeScript at the core; systems judged</text><text x="18" y="226" class="sans muted" font-size="9">through boundaries, invariants, and evidence.</text><text x="18" y="270" class="serif ink" font-size="23">Three systems. Three failure models.</text>
<g class="paper line"><rect x="18" y="292" width="354" height="150" rx="7"/><rect x="18" y="454" width="354" height="150" rx="7"/><rect x="18" y="616" width="354" height="150" rx="7"/></g><g class="mono accent caps" font-size="7"><text x="34" y="317">01 / CONSISTENCY</text><text x="34" y="479">02 / LOCAL FIRST</text><text x="34" y="641">03 / CONTROL</text></g><g class="serif ink" font-size="22"><text x="34" y="350">DropSpot</text><text x="34" y="512">spark</text><text x="34" y="674">Software Factory</text></g><g class="sans muted" font-size="9"><text x="34" y="374">Duplicate request ≠ duplicate allocation.</text><text x="34" y="536">Useful without account, server, or network.</text><text x="34" y="698">Disposable workers, durable workflow truth.</text></g><g class="wash line"><rect x="34" y="393" width="92" height="28"/><rect x="136" y="393" width="92" height="28"/><rect x="238" y="393" width="116" height="28"/><rect x="34" y="555" width="92" height="28"/><rect x="136" y="555" width="92" height="28"/><rect x="238" y="555" width="116" height="28"/><rect x="34" y="717" width="92" height="28"/><rect x="136" y="717" width="92" height="28"/><rect x="238" y="717" width="116" height="28"/></g><g class="mono ink caps" font-size="6"><text x="80" y="411" text-anchor="middle">REACT</text><text x="182" y="411" text-anchor="middle">EXPRESS</text><text x="296" y="411" text-anchor="middle">POSTGRES</text><text x="80" y="573" text-anchor="middle">REACT</text><text x="182" y="573" text-anchor="middle">DEXIE</text><text x="296" y="573" text-anchor="middle">INDEXEDDB</text><text x="80" y="735" text-anchor="middle">PLAN</text><text x="182" y="735" text-anchor="middle">VERIFY</text><text x="296" y="735" text-anchor="middle">HUMAN GATE</text></g><text x="18" y="810" class="mono accent caps" font-size="7">PROJECTS PROVE DECISIONS · NOT BADGES</text></symbol></defs><g id="dark" style="--bg:#0b0d10;--paper:#11151a;--wash:#171311;--ink:#f3f6fa;--muted:#96a0ad;--line:#3a4653;--accent:#db8b66"><rect width="390" height="845" fill="var(--bg)"/><use href="#scene"/></g><g id="light" style="--bg:#f3f1ec;--paper:#fff;--wash:#f7efe9;--ink:#15191e;--muted:#5b6672;--line:#b9c1ca;--accent:#a84c2b"><rect width="390" height="845" fill="var(--bg)"/><use href="#scene"/></g></svg>
