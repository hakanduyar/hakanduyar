<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>#dark,#light{display:none}#dark:target,#light:target{display:block}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.serif{font-family:Georgia,Times New Roman,serif}.mono{font-family:Consolas,monospace}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.paper{fill:var(--paper)}.wash{fill:var(--wash)}.line{stroke:var(--line)}.strong{stroke:var(--strong)}.caps{font-weight:700;letter-spacing:1.4px}.hair{shape-rendering:crispEdges}</style><defs><symbol id="scene">
<text x="100" y="72" class="serif ink" font-size="50">Hakan Duyar</text><text x="1340" y="48" text-anchor="end" class="mono muted caps" font-size="9">FRONT-END &amp; SYSTEMS ENGINEERING</text><text x="1340" y="67" text-anchor="end" class="mono muted caps" font-size="9">ARCHITECTURE CASEBOOK / 2026</text><line x1="100" y1="88" x2="1340" y2="88" class="strong hair" stroke-width="3"/><line x1="100" y1="94" x2="1340" y2="94" class="strong hair"/>
<text x="100" y="136" class="mono accent caps" font-size="9">ENGINEERING IDENTITY</text><text x="100" y="202" class="serif ink" font-size="55">Architecture makes product intent</text><text x="100" y="260" class="serif ink" font-size="55">accountable behavior.</text><text x="100" y="304" class="sans muted" font-size="14">React and TypeScript at the core. Services, data, delivery, and AI workflows</text><text x="100" y="326" class="sans muted" font-size="14">evaluated through boundaries, invariants, and evidence.</text>
<line x1="880" y1="145" x2="880" y2="332" class="strong hair"/><text x="910" y="178" class="mono accent caps" font-size="9">EDITORIAL PRINCIPLE</text><text x="910" y="208" class="sans muted" font-size="13">Projects are remembered by the</text><text x="910" y="229" class="sans muted" font-size="13">engineering decision they prove—</text><text x="910" y="250" class="sans muted" font-size="13">not by a badge wall.</text>
<line x1="100" y1="378" x2="1340" y2="378" class="line hair"/><text x="100" y="417" class="mono muted caps" font-size="9">SELECTED ARCHITECTURE DOSSIERS</text><text x="100" y="462" class="serif ink" font-size="36">Three systems. Three failure models.</text>
<g><rect x="100" y="500" width="390" height="355" rx="8" class="paper line"/><rect x="525" y="500" width="390" height="355" rx="8" class="paper line"/><rect x="950" y="500" width="390" height="355" rx="8" class="paper line"/></g>
<g class="mono accent caps" font-size="9"><text x="126" y="535">01 / CONSISTENCY</text><text x="551" y="535">02 / LOCAL FIRST</text><text x="976" y="535">03 / CONTROL</text></g><g class="serif ink" font-size="31"><text x="126" y="585">DropSpot</text><text x="551" y="585">spark</text><text x="976" y="585">Software Factory</text></g>
<g class="sans muted" font-size="12"><text x="126" y="621">Duplicate requests cannot become</text><text x="126" y="640">duplicate allocation.</text><text x="551" y="621">The product remains useful without</text><text x="551" y="640">account, server, or network.</text><text x="976" y="621">Disposable workers operate inside</text><text x="976" y="640">durable workflow truth.</text></g>
<g class="wash line"><rect x="126" y="677" width="96" height="45"/><rect x="234" y="677" width="96" height="45"/><rect x="342" y="677" width="120" height="45"/><rect x="551" y="677" width="96" height="45"/><rect x="659" y="677" width="96" height="45"/><rect x="767" y="677" width="120" height="45"/><rect x="976" y="677" width="96" height="45"/><rect x="1084" y="677" width="96" height="45"/><rect x="1192" y="677" width="120" height="45"/></g>
<g class="mono ink caps" font-size="8"><text x="174" y="704" text-anchor="middle">REACT</text><text x="282" y="704" text-anchor="middle">EXPRESS</text><text x="402" y="704" text-anchor="middle">POSTGRES</text><text x="599" y="704" text-anchor="middle">REACT</text><text x="707" y="704" text-anchor="middle">DEXIE</text><text x="827" y="704" text-anchor="middle">INDEXEDDB</text><text x="1024" y="704" text-anchor="middle">PLAN</text><text x="1132" y="704" text-anchor="middle">VERIFY</text><text x="1252" y="704" text-anchor="middle">REVIEW</text></g>
<g class="strong hair"><line x1="126" y1="758" x2="462" y2="758"/><line x1="551" y1="758" x2="887" y2="758"/><line x1="976" y1="758" x2="1312" y2="758"/></g><g class="mono accent caps" font-size="9"><text x="126" y="790">ROW LOCKS + IDEMPOTENT TRANSACTION</text><text x="551" y="790">VERSIONED LOCAL PRODUCT STATE</text><text x="976" y="790">EVIDENCE + HUMAN RELEASE GATE</text></g>
<text x="100" y="924" class="serif ink" font-size="28">Depth is editorially dominant; breadth appears as supporting evidence.</text><text x="1340" y="924" text-anchor="end" class="mono accent caps" font-size="9">CASE-STUDY LED</text></symbol></defs>
<g id="dark" style="--bg:#0b0d10;--paper:#11151a;--wash:#171311;--ink:#f3f6fa;--muted:#96a0ad;--line:#29313b;--strong:#3a4653;--accent:#db8b66"><rect width="1440" height="1000" fill="var(--bg)"/><use href="#scene"/></g><g id="light" style="--bg:#f3f1ec;--paper:#fff;--wash:#f7efe9;--ink:#15191e;--muted:#5b6672;--line:#d7dce1;--strong:#aeb7c1;--accent:#a84c2b"><rect width="1440" height="1000" fill="var(--bg)"/><use href="#scene"/></g></svg>
