<svg xmlns="http://www.w3.org/2000/svg" width="390" height="845" viewBox="0 0 390 845"><style>#dark,#light{display:none}#dark:target,#light:target{display:block}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.critical{fill:var(--critical)}.paper{fill:var(--paper)}.wash{fill:var(--wash)}.line{stroke:var(--line)}.caps{font-weight:700;letter-spacing:1px}.hair{shape-rendering:crispEdges}</style><defs><symbol id="scene"><text x="18" y="30" class="mono muted caps" font-size="6">HAKAN DUYAR / FRONT-END &amp; SYSTEMS ENGINEERING</text><line x1="18" y1="44" x2="372" y2="44" class="line hair"/><text x="18" y="91" class="sans ink" font-size="33" font-weight="650">Engineering with AI.</text><text x="18" y="128" class="sans ink" font-size="33" font-weight="650">Under control.</text><text x="18" y="153" class="sans muted" font-size="9">Inspectable · verifiable · human-governed.</text><rect x="18" y="178" width="354" height="105" class="paper line"/><text x="32" y="202" class="mono accent caps" font-size="7">SOFTWARE FACTORY / PUBLIC PROOF</text><text x="32" y="229" class="mono ink caps" font-size="7">DURABLE</text><text x="126" y="229" class="mono ink caps" font-size="7">INDEPENDENT</text><text x="246" y="229" class="mono ink caps" font-size="7">FAIL CLOSED</text><text x="32" y="247" class="sans muted" font-size="8">state</text><text x="126" y="247" class="sans muted" font-size="8">review</text><text x="246" y="247" class="sans muted" font-size="8">authority</text><rect x="32" y="260" width="326" height="14" class="wash"/><text x="350" y="270" text-anchor="end" class="mono critical caps" font-size="6">HUMAN DECISION</text>
<text x="18" y="328" class="mono muted caps" font-size="7">01 / SYSTEM MODEL</text><text x="18" y="358" class="sans ink" font-size="21" font-weight="650">Three accountable planes.</text>
<g class="paper line"><rect x="18" y="380" width="354" height="116" rx="6"/><rect x="18" y="506" width="354" height="116" rx="6"/><rect x="18" y="632" width="354" height="116" rx="6"/></g><text x="34" y="407" class="mono critical caps" font-size="7">DECISION</text><text x="34" y="533" class="mono blue caps" font-size="7">EXECUTION</text><text x="34" y="659" class="mono accent caps" font-size="7">EVIDENCE</text><g class="mono ink caps" font-size="7"><text x="34" y="437">OBJECTIVE</text><text x="138" y="437">APPROVAL</text><text x="252" y="437">RELEASE</text><text x="34" y="563">PLAN</text><text x="138" y="563">IMPLEMENT</text><text x="252" y="563">REVIEW</text><text x="34" y="689">SQLITE</text><text x="138" y="689">TESTS</text><text x="252" y="689">SNAPSHOT</text></g><g class="sans muted" font-size="8"><text x="34" y="458">intent</text><text x="138" y="458">revision bound</text><text x="252" y="458">human gate</text><text x="34" y="584">proposal</text><text x="138" y="584">scoped worker</text><text x="252" y="584">independent</text><text x="34" y="710">durable truth</text><text x="138" y="710">fixed facts</text><text x="252" y="710">lineage</text></g><rect x="18" y="770" width="354" height="54" class="wash"/><rect x="18" y="770" width="3" height="54" class="critical"/><text x="32" y="793" class="sans muted" font-size="8">The model participates; it is never</text><text x="32" y="807" class="sans muted" font-size="8">the system of record.</text><text x="356" y="800" text-anchor="end" class="mono critical caps" font-size="6">NO SELF-APPROVAL</text></symbol></defs><g id="dark" style="--bg:#0b0d10;--paper:#11151a;--wash:#121a1a;--ink:#f3f6fa;--muted:#96a0ad;--line:#3a4653;--accent:#72b7a4;--blue:#75a6df;--critical:#e0b66f"><rect width="390" height="845" fill="var(--bg)"/><use href="#scene"/></g><g id="light" style="--bg:#f3f1ec;--paper:#fff;--wash:#edf5f2;--ink:#15191e;--muted:#5b6672;--line:#b9c1ca;--accent:#1f7863;--blue:#2c659f;--critical:#96631f"><rect width="390" height="845" fill="var(--bg)"/><use href="#scene"/></g></svg>
