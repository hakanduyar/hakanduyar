<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>#dark,#light{display:none}#dark:target,#light:target{display:block}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.critical{fill:var(--critical)}.paper{fill:var(--paper)}.wash{fill:var(--wash)}.line{stroke:var(--line)}.strong{stroke:var(--strong)}.caps{font-weight:700;letter-spacing:1.4px}.hair{shape-rendering:crispEdges}</style><defs><symbol id="scene">
<text x="100" y="55" class="mono muted caps" font-size="9">HAKAN DUYAR / FRONT-END &amp; SYSTEMS ENGINEERING</text><line x1="100" y1="78" x2="1340" y2="78" class="line hair"/>
<text x="100" y="155" class="sans ink" font-size="56" font-weight="650">Engineering with AI.</text><text x="100" y="216" class="sans ink" font-size="56" font-weight="650">Under control.</text><text x="100" y="258" class="sans muted" font-size="14">Product architecture extended by agentic workflows that remain</text><text x="100" y="280" class="sans muted" font-size="14">inspectable, verifiable, and human-governed.</text>
<rect x="780" y="118" width="560" height="178" class="paper strong"/><text x="806" y="145" class="mono muted caps" font-size="8">PUBLIC PROOF / SOFTWARE FACTORY</text><g class="line"><rect x="806" y="166" width="154" height="74"/><rect x="973" y="166" width="154" height="74"/><rect x="1140" y="166" width="174" height="74"/></g><g class="mono accent caps" font-size="8"><text x="820" y="189">DURABLE</text><text x="987" y="189">INDEPENDENT</text><text x="1154" y="189">FAIL CLOSED</text></g><g class="sans muted" font-size="9"><text x="820" y="211">plans · runs · evidence</text><text x="987" y="211">implementer / reviewer</text><text x="1154" y="211">no inferred authority</text></g><rect x="806" y="250" width="508" height="30" class="wash"/><rect x="806" y="250" width="3" height="30" class="critical"/><text x="822" y="270" class="mono muted" font-size="8">content-addressed snapshot</text><text x="1298" y="270" text-anchor="end" class="mono critical caps" font-size="8">HUMAN DECISION</text>
<line x1="100" y1="342" x2="1340" y2="342" class="line hair"/><text x="100" y="382" class="mono muted caps" font-size="9">01 / SYSTEM MODEL</text><text x="100" y="426" class="sans ink" font-size="31" font-weight="650">Three planes keep autonomy accountable.</text><text x="1340" y="382" text-anchor="end" class="sans muted" font-size="12">The model participates; it is never the system of record.</text>
<g class="paper strong"><rect x="100" y="468" width="1240" height="102"/><rect x="100" y="580" width="1240" height="102"/><rect x="100" y="692" width="1240" height="102"/></g>
<g class="mono caps" font-size="9"><text x="124" y="500" class="critical">DECISION PLANE</text><text x="124" y="612" class="blue">EXECUTION PLANE</text><text x="124" y="724" class="accent">EVIDENCE PLANE</text></g><g class="line hair"><line x1="310" y1="468" x2="310" y2="794"/><line x1="515" y1="468" x2="515" y2="794"/><line x1="720" y1="468" x2="720" y2="794"/><line x1="925" y1="468" x2="925" y2="794"/><line x1="1130" y1="468" x2="1130" y2="794"/></g>
<g class="mono ink caps" font-size="9"><text x="334" y="504">OBJECTIVE</text><text x="539" y="504">PLAN APPROVAL</text><text x="744" y="504">POLICY</text><text x="949" y="504">RESOURCE</text><text x="1154" y="504">RELEASE GATE</text><text x="334" y="616">PLANNER</text><text x="539" y="616">IMPLEMENTER</text><text x="744" y="616">VERIFIER</text><text x="949" y="616">REVIEWER</text><text x="1154" y="616">REPAIR</text><text x="334" y="728">SQLITE STATE</text><text x="539" y="728">RUNS</text><text x="744" y="728">TEST EVIDENCE</text><text x="949" y="728">VERDICTS</text><text x="1154" y="728">SNAPSHOT</text></g>
<g class="sans muted" font-size="9"><text x="334" y="529">intent + constraints</text><text x="539" y="529">revision + digest</text><text x="744" y="529">roles + budgets</text><text x="949" y="529">availability / backoff</text><text x="1154" y="529">trusted human token</text><text x="334" y="641">proposal, not authority</text><text x="539" y="641">workspace scope</text><text x="744" y="641">fixed commands</text><text x="949" y="641">independent principal</text><text x="1154" y="641">bounded remediation</text><text x="334" y="753">durable workflow truth</text><text x="539" y="753">process outcomes</text><text x="744" y="753">deterministic facts</text><text x="949" y="753">strict parsed result</text><text x="1154" y="753">content lineage</text></g>
<rect x="100" y="824" width="1240" height="58" class="wash"/><text x="124" y="858" class="sans ink" font-size="12">Any newer implementation invalidates prior verification, review, and approval.</text><text x="1316" y="858" text-anchor="end" class="mono critical caps" font-size="9">NO SELF-APPROVAL</text>
<text x="100" y="942" class="mono accent caps" font-size="9">REACT / TYPESCRIPT CORE · AI CONTROL PLANE AS APPLIED SYSTEMS PROOF</text><text x="1340" y="942" text-anchor="end" class="mono blue caps" font-size="9">AI MATURITY FIRST</text></symbol></defs>
<g id="dark" style="--bg:#0b0d10;--paper:#11151a;--wash:#121a1a;--ink:#f3f6fa;--muted:#96a0ad;--line:#29313b;--strong:#3a4653;--accent:#72b7a4;--blue:#75a6df;--critical:#e0b66f"><rect width="1440" height="1000" fill="var(--bg)"/><use href="#scene"/></g><g id="light" style="--bg:#f3f1ec;--paper:#fff;--wash:#edf5f2;--ink:#15191e;--muted:#5b6672;--line:#d7dce1;--strong:#aeb7c1;--accent:#1f7863;--blue:#2c659f;--critical:#96631f"><rect width="1440" height="1000" fill="var(--bg)"/><use href="#scene"/></g></svg>
