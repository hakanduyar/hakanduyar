<svg xmlns="http://www.w3.org/2000/svg" width="390" height="845" viewBox="0 0 390 845">
  <style>#dark,#light{display:none}#dark:target,#light:target{display:block}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.signal{fill:var(--signal)}.line{stroke:var(--line)}.paper{fill:var(--paper)}.wash{fill:var(--wash)}.caps{font-weight:700;letter-spacing:1px}.hair{shape-rendering:crispEdges}</style>
  <defs><symbol id="scene"><text x="20" y="30" class="sans ink" font-size="12" font-weight="700">Hakan Duyar</text><text x="370" y="30" text-anchor="end" class="mono muted caps" font-size="7">SYSTEM BRIEF / V5</text><line x1="20" y1="44" x2="370" y2="44" class="line hair"/>
  <text x="20" y="78" class="mono accent caps" font-size="7">FRONT-END &amp; SYSTEMS ENGINEERING</text><text x="20" y="126" class="sans ink" font-size="34" font-weight="650">Interfaces are</text><text x="20" y="163" class="sans ink" font-size="34" font-weight="650">the surface.</text><text x="20" y="200" class="sans ink" font-size="34" font-weight="650">Systems are the work.</text><text x="20" y="228" class="sans muted" font-size="10">React + TypeScript products with clear boundaries</text><text x="20" y="244" class="sans muted" font-size="10">from interface to evidence.</text>
  <rect x="20" y="272" width="350" height="84" class="paper line"/><text x="34" y="296" class="mono accent caps" font-size="7">PRIMARY</text><text x="110" y="296" class="sans muted" font-size="9">React · TypeScript · architecture</text><text x="34" y="322" class="mono accent caps" font-size="7">AI PRACTICE</text><text x="110" y="322" class="sans muted" font-size="9">plan · implement · verify · review</text><text x="34" y="346" class="mono signal caps" font-size="7">PRINCIPLE</text><text x="110" y="346" class="sans muted" font-size="9">evidence before confidence</text>
  <text x="20" y="397" class="mono muted caps" font-size="7">01 / ENGINEERING SYSTEM</text><text x="20" y="426" class="sans ink" font-size="21" font-weight="650">Five responsibilities.</text>
  <g class="paper line"><rect x="20" y="448" width="350" height="58"/><rect x="20" y="512" width="350" height="58"/><rect x="20" y="576" width="350" height="58"/><rect x="20" y="640" width="350" height="58"/><rect x="20" y="704" width="350" height="58"/></g>
  <g class="mono accent caps" font-size="7"><text x="34" y="469">INTERFACE</text><text x="34" y="533">APPLICATION</text><text x="34" y="597">SERVICES</text><text x="34" y="661">DATA</text><text x="34" y="725">PLATFORM</text></g><g class="sans ink" font-size="10"><text x="128" y="469">React · TypeScript · Next.js</text><text x="128" y="533">State · Query · PWA / Dexie</text><text x="128" y="597">Node · Express / Nest · REST</text><text x="128" y="661">PostgreSQL · Prisma · Supabase</text><text x="128" y="725">Docker · CI · Nginx / Linux</text></g><g class="sans muted" font-size="8"><text x="128" y="488">core product surface</text><text x="128" y="552">state ownership</text><text x="128" y="616">domain boundaries</text><text x="128" y="680">relational / local truth</text><text x="128" y="744">Kubernetes remains expansion</text></g>
  <rect x="20" y="782" width="350" height="42" class="wash"/><rect x="20" y="782" width="3" height="42" class="signal"/><text x="32" y="800" class="mono signal caps" font-size="7">SOFTWARE FACTORY</text><text x="32" y="815" class="sans muted" font-size="8">durable state · independent review · human release gate</text></symbol></defs>
  <g id="dark" style="--bg:#0b0d10;--paper:#11151a;--wash:#111722;--ink:#f3f6fa;--muted:#96a0ad;--line:#3a4653;--accent:#8eb4ff;--signal:#d7b85c"><rect width="390" height="845" fill="var(--bg)"/><use href="#scene"/></g><g id="light" style="--bg:#f3f1ec;--paper:#fff;--wash:#edf2f8;--ink:#15191e;--muted:#5b6672;--line:#b9c1ca;--accent:#245fae;--signal:#8a6411"><rect width="390" height="845" fill="var(--bg)"/><use href="#scene"/></g>
</svg>
