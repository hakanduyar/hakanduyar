<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="architecture-dark-title architecture-dark-desc" role="img" viewBox="0 0 960 390"><title id="architecture-dark-title">Spatial engineering architecture from interface through delivery</title><desc id="architecture-dark-desc">Four connected layers: interface, state, services, and delivery. AI-assisted development supports the process while engineering judgment remains accountable.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#f0f6fc}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.muted{fill:#8b949e}.micro{font-size:9px;letter-spacing:1.8px;font-weight:600}.tiny{font-size:8px;letter-spacing:1.15px}.layer{font-size:15px;font-weight:650}.copy{font-size:11px}</style><defs><linearGradient id="architecture-spectrum" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a371f7"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#56d4ad"/></linearGradient><filter id="architecture-shadow" width="150%" height="220%" x="-20%" y="-50%"><feDropShadow dx="0" dy="12" flood-color="#f0f6fc" flood-opacity=".08" stdDeviation="12"/></filter></defs><g><path stroke="#a371f7" stroke-width="2" d="M54 54h34"/><text x="104" y="58" fill="#a371f7" class="mono micro">ARCHITECTURE / COMPOSED</text><text x="54" y="104" font-size="25" font-weight="600" letter-spacing="-1.1">A clear path from interface to delivery.</text><text x="54" y="130" class="copy muted">Spatial layers keep system boundaries visible without turning them into boxes.</text></g><g><path stroke="#30363d" d="M54 194h326"/><circle cx="54" cy="194" r="7" fill="#0d1117" stroke="#a371f7" stroke-width="1.4"/><text x="54" y="223" class="mono tiny muted">INTERFACE</text><path stroke="#30363d" stroke-dasharray="3 8" d="M66 194h84"/><circle cx="162" cy="194" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><text x="162" y="223" class="mono tiny muted" text-anchor="middle">STATE</text><path stroke="#30363d" stroke-dasharray="3 8" d="M174 194h84"/><circle cx="270" cy="194" r="7" fill="#0d1117" stroke="#56d4ad" stroke-width="1.4"/><text x="270" y="223" class="mono tiny muted" text-anchor="middle">SERVICES</text><path stroke="#30363d" stroke-dasharray="3 8" d="M282 194h84"/><circle cx="378" cy="194" r="7" fill="#0d1117" stroke="#d29922" stroke-width="1.4"/><text x="378" y="223" class="mono tiny muted" text-anchor="end">DELIVERY</text><text x="54" y="278" fill="#58a6ff" class="mono micro">AI-ASSISTED DEVELOPMENT</text><text x="54" y="302" class="copy muted">Automation supports the path. Engineering judgment owns it.</text><path stroke="url(#architecture-spectrum)" stroke-width="2" d="M54 332h338"/></g><path fill="#0d1117" fill-opacity=".82" stroke="#a371f7" stroke-opacity=".74" d="m483 126 223-43 190 41-223 43Z" filter="url(#architecture-shadow)"/><text x="509" y="133" class="layer">Interface</text><text x="864" y="124" class="mono tiny muted" text-anchor="end">REACT / ACCESSIBILITY / MOTION</text><circle cx="698" cy="125" r="3.5" fill="#a371f7"/><path fill="#0d1117" fill-opacity=".82" stroke="#58a6ff" stroke-opacity=".74" d="m498 192 223-43 175 41-211 43Z" filter="url(#architecture-shadow)"/><text x="524" y="199" class="layer">State</text><text x="864" y="190" class="mono tiny muted" text-anchor="end">TYPESCRIPT / DATA / OFFLINE</text><circle cx="710" cy="191" r="3.5" fill="#58a6ff"/><path fill="#0d1117" fill-opacity=".82" stroke="#56d4ad" stroke-opacity=".74" d="m513 258 223-43 160 41-199 43Z" filter="url(#architecture-shadow)"/><text x="539" y="265" class="layer">Services</text><text x="864" y="256" class="mono tiny muted" text-anchor="end">NODE / API / TRANSACTIONS</text><circle cx="722" cy="257" r="3.5" fill="#56d4ad"/><path fill="#0d1117" fill-opacity=".82" stroke="#d29922" stroke-opacity=".74" d="m528 324 223-43 145 41-187 43Z" filter="url(#architecture-shadow)"/><text x="554" y="331" class="layer">Delivery</text><text x="864" y="322" class="mono tiny muted" text-anchor="end">TEST / PERFORMANCE / RELEASE</text><circle cx="734" cy="323" r="3.5" fill="#d29922"/></svg>