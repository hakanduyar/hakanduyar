<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-factory-title v5-project-factory-desc" role="img" viewBox="0 0 880 680"><title id="v5-project-factory-title">01 — Software Factory</title><desc id="v5-project-factory-desc">Agents can produce work. They cannot grant it authority. A durable control plane keeps planning, execution, verification, review, and release as separate responsibilities. Not claimed: GitHub issue/PR automation, n8n orchestration, deployment, publishing, or a completed control-room UI.</desc><path fill="#0a0c10" d="M0 0h880v680H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#0a0c10" d="M20 0h840v118H20z"/><text x="38" y="40" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02 / APPLICATIONS</text><text x="38" y="82" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1"><tspan x="38" dy="0">Four systems, read by the failure</tspan><tspan x="38" dy="37">each one is built to prevent.</tspan></text><text x="571" y="64" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="571" dy="0">Constraint → architecture → evidence.</tspan><tspan x="571" dy="18">Scope limits remain part of the claim.</tspan></text><path fill="#12161c" stroke="#3a444f" d="M20 130h840v550H20z"/><text x="38" y="157" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="80" y="159" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="670" letter-spacing="-.9">Software Factory</text><text x="842" y="157" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">GOVERNED AGENTIC ENGINEERING · CONTROL PLANE</text><path stroke="#242b34" d="M38 176h804"/><path fill="#171c23" stroke="#3a444f" d="M38 191h27v22H38z"/><text x="51.5" y="206" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#88a7cd" stroke="#88a7cd" d="M69 191h27v22H69z"/><text x="82.5" y="206" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#88a7cd" stroke="#88a7cd" d="M100 191h27v22h-27z"/><text x="113.5" y="206" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#88a7cd" stroke="#88a7cd" d="M131 191h27v22h-27z"/><text x="144.5" y="206" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#88a7cd" stroke="#88a7cd" d="M162 191h27v22h-27z"/><text x="175.5" y="206" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="210" y="206" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">APPLICATION → PLATFORM · NO PRODUCT INTERFACE CLAIMED</text><text x="38" y="249" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="650" letter-spacing="-.45">Agents can produce work. They cannot grant it authority.</text><text x="38" y="276" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="38" dy="0">A durable control plane keeps planning, execution, verification, review, and release as separate responsibilities.</tspan></text><path fill="#1b222a" stroke="#3a444f" d="M38 305h804v96H38z"/><text x="54" y="329" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DURABLE DOMAIN · SQLITE</text><path fill="#12161c" stroke="#3a444f" d="M54 347h50v23H54z"/><text x="63" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">plans</text><path fill="#12161c" stroke="#3a444f" d="M110 347h73.8v23H110z"/><text x="119" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">revisions</text><path fill="#12161c" stroke="#3a444f" d="M189.8 347h80v23h-80z"/><text x="198.8" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">work items</text><path fill="#12161c" stroke="#3a444f" d="M275.8 347h50v23h-50z"/><text x="284.8" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">runs</text><path fill="#12161c" stroke="#3a444f" d="M331.8 347H480v23H331.8z"/><text x="340.8" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">verification evidence</text><path fill="#12161c" stroke="#3a444f" d="M486 347h61.4v23H486z"/><text x="495" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">reviews</text><path fill="#12161c" stroke="#3a444f" d="M553.4 347h73.8v23h-73.8z"/><text x="562.4" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">approvals</text><path fill="#12161c" stroke="#3a444f" d="M633.2 347h111v23h-111z"/><text x="642.2" y="363" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">release lineage</text><path fill="#171c23" stroke="#3a444f" d="M38 401h804v44H38z"/><text x="54" y="428" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PROVIDER-NEUTRAL WORKER PORTS</text><text x="826" y="428" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">DOMAIN DOES NOT KNOW THE VENDOR</text><path fill="#12161c" stroke="#3a444f" d="M38 445h804v72H38z"/><text x="54" y="470" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DISPOSABLE WORKERS · PROCESS ADAPTERS</text><path fill="#171c23" stroke="#3a444f" d="M54 484h88v24H54z"/><text x="66" y="501" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.2" font-weight="600">Codex CLI</text><path fill="#171c23" stroke="#3a444f" d="M149 484h115v24H149z"/><text x="161" y="501" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.2" font-weight="600">Claude Code CLI</text><text x="826" y="501" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500" text-anchor="end">Workspace-scoped · default deny · replaceable</text><path stroke="#242b34" d="M38 541h804"/><text x="38" y="571" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DURABILITY</text><text x="38" y="592" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Workers are disposable.</text><text x="38" y="610" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">The domain above them is not.</text><path stroke="#242b34" d="M306 551v68"/><text x="320" y="571" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">FAIL CLOSED</text><text x="320" y="592" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Verdicts parse strictly.</text><text x="320" y="610" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">Ambiguous output never becomes a pass.</text><path stroke="#242b34" d="M574 551v68"/><text x="588" y="571" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SUPERVISION</text><text x="588" y="592" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Zero autonomous spend.</text><text x="588" y="610" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">Resource and backoff policy persist.</text><path fill="#171c23" stroke="#3a444f" d="M38 633h804v48H38z"/><path fill="#d3b36a" d="M38 633h3v48h-3z"/><text x="54" y="653" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">NOT CLAIMED</text><text x="146" y="654" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500"><tspan x="146" dy="0">GitHub issue/PR automation, n8n orchestration, deployment, publishing, or a completed control-room UI.</tspan></text></svg>