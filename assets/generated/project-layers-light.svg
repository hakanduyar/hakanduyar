<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-layers-title v5-project-layers-desc" role="img" viewBox="0 0 880 480"><title id="v5-project-layers-title">03 — Built in Layers</title><desc id="v5-project-layers-desc">Content cannot publish itself past its own contract. A typed content pipeline where accessibility is delivery evidence rather than an assertion. Scope: architecture proof, not the subject of the profile.</desc><path fill="#e5e7e2" d="M0 0h880v480H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}path{shape-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M20 0h840v480H20z"/><text x="38" y="27" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="80" y="29" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="670" letter-spacing="-.9">Built in Layers</text><text x="842" y="27" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">ARCHITECTURE-LED FRONTEND · CONTENT SYSTEM</text><path stroke="#d6d8d3" d="M38 46h804"/><path fill="#2b5581" stroke="#2b5581" d="M38 61h27v22H38z"/><text x="51.5" y="76" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#2b5581" stroke="#2b5581" d="M69 61h27v22H69z"/><text x="82.5" y="76" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#f1f2ee" stroke="#a8ada8" d="M100 61h27v22h-27z"/><text x="113.5" y="76" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#2b5581" stroke="#2b5581" d="M131 61h27v22h-27z"/><text x="144.5" y="76" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#2b5581" stroke="#2b5581" d="M162 61h27v22h-27z"/><text x="175.5" y="76" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="210" y="76" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INTERFACE → PLATFORM · CONTENT IS THE DATA LAYER</text><text x="38" y="119" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18.5" font-weight="650" letter-spacing="-.45">Content cannot publish itself past its own contract.</text><text x="38" y="146" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="38" dy="0">A typed content pipeline where accessibility is delivery evidence rather than an assertion.</tspan></text><path fill="#f1f2ee" stroke="#d6d8d3" d="M38 178h262.67v72H38z"/><text x="51" y="199" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="51" y="221" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Typed MDX</text><text x="51" y="239" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.3" font-weight="500">Gray Matter and Zod validate frontmatter</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M308.67 178h262.67v72H308.67z"/><text x="321.67" y="199" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="321.67" y="221" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Publication gates</text><text x="321.67" y="239" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.3" font-weight="500">Invalid content fails the build</text><path fill="#a8ada8" d="m302.67 214 4-4v8z"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M579.33 178H842v72H579.33z"/><text x="592.33" y="199" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="592.33" y="221" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Server-first render</text><text x="592.33" y="239" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.3" font-weight="500">RSC and SSG, then progressive enhancement</text><path fill="#a8ada8" d="m573.33 214 4-4v8z"/><path stroke="#d6d8d3" d="M38 263h804"/><text x="38" y="291" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="38" y="312" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Frontmatter is a schema.</text><text x="38" y="330" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">A broken document stops the build.</text><path stroke="#d6d8d3" d="M306 271v68"/><text x="320" y="291" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">BOUNDARY</text><text x="320" y="312" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Server-first by default.</text><text x="320" y="330" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">Interactivity earns its cost.</text><path stroke="#d6d8d3" d="M574 271v68"/><text x="588" y="291" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="588" y="312" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Playwright and axe run.</text><text x="588" y="330" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">Accessibility stays checkable.</text><path fill="#f1f2ee" stroke="#a8ada8" d="M38 353h804v48H38z"/><path fill="#7c5a0f" d="M38 353h3v48h-3z"/><text x="54" y="373" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SCOPE BOUNDARY</text><text x="184" y="374" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="500"><tspan x="184" dy="0">Scope: architecture proof, not the subject of the profile.</tspan></text></svg>