<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-ai-title v5-ai-desc" role="img" viewBox="0 0 880 360"><title id="v5-ai-title">Governed AI engineering workflow</title><desc id="v5-ai-desc">Specify, plan, approve, implement, verify, independently review, repair when required, and release through a human gate.</desc><path fill="#e5e7e2" d="M0 0h880v360H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}path{shape-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M20 0h840v344H20z"/><text x="38" y="40" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03 / AI ENGINEERING</text><text x="38" y="82" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1"><tspan x="38" dy="0">Governed workflow. Human release.</tspan></text><text x="586" y="65" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="586" dy="0">Execution is assisted.</tspan><tspan x="586" dy="18">Evidence and authority persist.</tspan></text><path fill="#f1f2ee" stroke="#d6d8d3" d="M38 151h91v78H38z"/><text x="50" y="171" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="50" y="198" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Specify</text><text x="50" y="218" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">HUMAN</text><path fill="#a8ada8" d="m132 190 5-4v8z"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M140 151h91v78h-91z"/><text x="152" y="171" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="152" y="198" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Plan</text><text x="152" y="218" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">AGENT</text><path fill="#a8ada8" d="m234 190 5-4v8z"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M242 151h91v78h-91z"/><text x="254" y="171" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="254" y="198" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Approve</text><text x="254" y="218" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">HUMAN</text><path fill="#a8ada8" d="m336 190 5-4v8z"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M344 151h91v78h-91z"/><text x="356" y="171" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04</text><text x="356" y="198" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Implement</text><text x="356" y="218" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">AGENT</text><path fill="#a8ada8" d="m438 190 5-4v8z"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M446 151h91v78h-91z"/><text x="458" y="171" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">05</text><text x="458" y="198" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-