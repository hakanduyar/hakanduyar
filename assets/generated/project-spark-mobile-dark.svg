<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-spark-mobile-title v5-project-spark-mobile-desc" role="img" viewBox="0 0 480 760"><title id="v5-project-spark-mobile-title">02 — Spark</title><desc id="v5-project-spark-mobile-desc">It keeps working with no account, no server, and no network. A React and TypeScript planning application where the browser is the database. Not claimed: backend, login, cloud sync, or an automated test suite.</desc><path fill="#0a0c10" d="M0 0h480v760H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#12161c" stroke="#3a444f" d="M16 0h448v760H16z"/><text x="32" y="24" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="74" y="26" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="670" letter-spacing="-.9">Spark</text><text x="32" y="56" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">LOCAL-FIRST REACT PWA</text><path stroke="#242b34" d="M32 71h416"/><path fill="#88a7cd" stroke="#88a7cd" d="M32 86h27v22H32z"/><text x="45.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#88a7cd" stroke="#88a7cd" d="M63 86h27v22H63z"/><text x="76.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#171c23" stroke="#3a444f" d="M94 86h27v22H94z"/><text x="107.5" y="101" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#88a7cd" stroke="#88a7cd" d="M125 86h27v22h-27z"/><text x="138.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#171c23" stroke="#3a444f" d="M156 86h27v22h-27z"/><text x="169.5" y="101" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="204" y="101" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INTERFACE → DATA · NO SERVER</text><text x="32" y="138" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="650" letter-spacing="-.4"><tspan x="32" dy="0">It keeps working with no account,</tspan><tspan x="32" dy="21">no server, and no network.</tspan></text><text x="32" y="191" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500"><tspan x="32" dy="0">A React and TypeScript planner where the browser</tspan><tspan x="32" dy="18">is the database.</tspan></text><path fill="#171c23" stroke="#242b34" d="M32 232h416v57H32z"/><text x="45" y="252" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="83" y="253" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">React surfaces</text><text x="83" y="273" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Feature views · transactional actions</text><path fill="#171c23" stroke="#242b34" d="M32 299h416v57H32z"/><text x="45" y="319" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="83" y="320" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Dexie live queries</text><text x="83" y="340" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Reactive compound-index reads</text><path fill="#171c23" stroke="#242b34" d="M32 366h416v57H32z"/><text x="45" y="386" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="83" y="387" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">IndexedDB</text><text x="83" y="407" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Versioned persistence · v1 → v8</text><path stroke="#242b34" d="M32 442h416"/><text x="32" y="469" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PERSISTENCE</text><text x="145" y="470" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">IndexedDB is product state.</text><text x="145" y="489" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">It is not treated as a cache.</text><path stroke="#242b34" d="M32 511h416"/><text x="32" y="530" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">RECOVERY</text><text x="145" y="531" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Export/import is transactional.</text><text x="145" y="550" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">The service worker keeps the shell available.</text><path stroke="#242b34" d="M32 572h416"/><text x="32" y="591" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">AI BOUNDARY</text><text x="145" y="592" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Drafts are proposals.</text><text x="145" y="611" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">A person accepts before persistence.</text><path fill="#171c23" stroke="#3a444f" d="M32 645h416v70H32z"/><path fill="#d3b36a" d="M32 645h3v70h-3z"/><text x="48" y="665" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SCOPE BOUNDARY</text><text x="48" y="687" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500"><tspan x="48" dy="0">No backend, login, cloud sync,</tspan><tspan x="48" dy="17">or automated test suite is claimed.</tspan></text></svg>