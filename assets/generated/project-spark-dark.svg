<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-spark-title v5-project-spark-desc" role="img" viewBox="0 0 880 480"><title id="v5-project-spark-title">02 — Spark</title><desc id="v5-project-spark-desc">It keeps working with no account, no server, and no network. A React and TypeScript planning application where the browser is the database. Not claimed: backend, login, cloud sync, or an automated test suite.</desc><path fill="#0a0c10" d="M0 0h880v480H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}path{shape-rendering:geometricPrecision}</style><path fill="#12161c" stroke="#3a444f" d="M20 0h840v480H20z"/><text x="38" y="27" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="80" y="29" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="670" letter-spacing="-.9">Spark</text><text x="842" y="27" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">LOCAL-FIRST REACT PWA · CLIENT PERSISTENCE</text><path stroke="#242b34" d="M38 46h804"/><path fill="#88a7cd" stroke="#88a7cd" d="M38 61h27v22H38z"/><text x="51.5" y="76" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#88a7cd" stroke="#88a7cd" d="M69 61h27v22H69z"/><text x="82.5" y="76" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#171c23" stroke="#3a444f" d="M100 61h27v22h-27z"/><text x="113.5" y="76" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#88a7cd" stroke="#88a7cd" d="M131 61h27v22h-27z"/><text x="144.5" y="76" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#171c23" stroke="#3a444f" d="M162 61h27v22h-27z"/><text x="175.5" y="76" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="210" y="76" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INTERFACE → DATA · NO SERVER</text><text x="38" y="119" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18.5" font-weight="650" letter-spacing="-.45">It keeps working with no account, no server, and no network.</text><text x="38" y="146" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="38" dy="0">A React and TypeScript planning application where the browser is the database.</tspan></text><path fill="#171c23" stroke="#242b34" d="M38 178h262.67v72H38z"/><text x="51" y="199" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="51" y="221" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">React surfaces</text><text x="51" y="239" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.3" font-weight="500">Feature views and transactional actions</text><path fill="#171c23" stroke="#242b34" d="M308.67 178h262.67v72H308.67z"/><text x="321.67" y="199" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="321.67" y="221" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Dexie live queries</text><text x="321.67" y="239" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.3" font-weight="500">Reactive reads over compound indexes</text><path fill="#3a444f" d="m302.67 214 4-4v8z"/><path fill="#171c23" stroke="#242b34" d="M579.33 178H842v72H579.33z"/><text x="592.33" y="199" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="592.33" y="221" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">IndexedDB</text><text x="592.33" y="239" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.3" font-weight="500">Versioned persistence · schema v1 → v8</text><path fill="#3a444f" d="m573.33 214 4-4v8z"/><path stroke="#242b34" d="M38 263h804"/><text x="38" y="291" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PERSISTENCE</text><text x="38" y="312" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">IndexedDB is product state.</text><text x="38" y="330" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">It is not treated as a cache.</text><path stroke="#242b34" d="M306 271v68"/><text x="320" y="291" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">RECOVERY</text><text x="320" y="312" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Export/import is transactional.</text><text x="320" y="330" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">The service worker keeps the shell available.</text><path stroke="#242b34" d="M574 271v68"/><text x="588" y="291" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">AI BOUNDARY</text><text x="588" y="312" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Drafts are proposals.</text><text x="588" y="330" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500">A person accepts before persistence.</text><path fill="#171c23" stroke="#3a444f" d="M38 353h804v48H38z"/><path fill="#d3b36a" d="M38 353h3v48h-3z"/><text x="54" y="373" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SCOPE BOUNDARY</text><text x="184" y="374" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="500"><tspan x="184" dy="0">Not claimed: backend, login, cloud sync, or an automated test suite.</tspan></text></svg>