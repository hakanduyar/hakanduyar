<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="theme-control-mobile-light-title theme-control-mobile-light-desc" role="img" viewBox="0 0 390 92"><title id="theme-control-mobile-light-title">GitHub light and dark appearance settings</title><desc id="theme-control-mobile-light-desc">Open GitHub Appearance settings to choose light or dark mode. Profile visuals follow that preference automatically.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0d1117}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.label{font-size:13px;font-weight:680;letter-spacing:.25px}.caption{font-size:8.5px;font-weight:560;letter-spacing:.45px}.choice{font-size:10.5px;font-weight:720;letter-spacing:.85px}.muted{fill:#3d444d}.light-choice{fill:#fff}.dark-choice{fill:#3d444d}</style><g data-audit-geometry="appearance-control"><rect width="374" height="76" x="8" y="8" fill="#eef1f4" fill-opacity=".72" stroke="#768390" stroke-width="1.5" rx="18"/><path stroke="#98a3ae" stroke-width="1.2" d="M20 68h158"/><circle cx="171" cy="68" r="3" fill="#0550ae"/><rect width="180" height="64" x="192" y="14" fill="#fff" stroke="#768390" stroke-width="1.5" rx="32"/><rect width="83" height="54" x="197" y="19" fill="#0550ae" rx="27"/><path stroke="#768390" stroke-opacity=".7" d="M282 27v38"/><g aria-hidden="true"><circle cx="215" cy="46" r="7" fill="none" stroke="#fff" stroke-width="1.8"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="M227 46h6"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="m223.49 54.49 4.24 4.24"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="M215 58v6"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="m206.51 54.49-4.24 4.24"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="M203 46h-6"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="m206.51 37.51-4.24-4.24"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="M215 34v-6"/><path stroke="#fff" stroke-linecap="round" stroke-width="1.8" d="m223.49 37.51 4.24-4.24"/></g><path fill="none" stroke="#3d444d" stroke-linejoin="round" stroke-width="1.8" d="M308 33a16 16 0 1 0 5 21 13 13 0 0 1-5-21Z"/></g><g data-audit-text="appearance-copy"><text x="20" y="41" class="label">APPEARANCE</text><text x="20" y="59" class="mono caption muted">GITHUB SETTINGS ↗</text><text x="239" y="50" class="mono choice light-choice">LIGHT</text><text x="325" y="50" class="mono choice dark-choice">DARK</text></g></svg>