<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="architecture-light-title architecture-light-desc" role="img" viewBox="0 0 960 460"><title id="architecture-light-title">Spatial engineering architecture from interface through delivery</title><desc id="architecture-light-desc">Four connected layers: interface, state, services, and delivery. AI-assisted development supports the process while engineering judgment remains accountable.</desc><style>@keyframes architecture-phase{0%,to{opacity:.7}12%,72%{opacity:1}88%{opacity:.45}}@keyframes architecture-step-1{0%,8%,92%,to{opacity:0;stroke-dashoffset:1}12%{opacity:.95;stroke-dashoffset:1}23%,70%{opacity:.84;stroke-dashoffset:0}82%{opacity:.3;stroke-dashoffset:0}}@keyframes architecture-step-2{0%,21%,92%,to{opacity:0;stroke-dashoffset:1}25%{opacity:.95;stroke-dashoffset:1}36%,70%{opacity:.84;stroke-dashoffset:0}82%{opacity:.3;stroke-dashoffset:0}}@keyframes architecture-step-3{0%,35%,92%,to{opacity:0;stroke-dashoffset:1}39%{opacity:.95;stroke-dashoffset:1}50%,70%{opacity:.84;stroke-dashoffset:0}82%{opacity:.3;stroke-dashoffset:0}}@keyframes architecture-step-4{0%,49%,92%,to{opacity:0;stroke-dashoffset:1}53%{opacity:.95;stroke-dashoffset:1}64%,70%{opacity:.84;stroke-dashoffset:0}82%{opacity:.3;stroke-dashoffset:0}}@keyframes architecture-signal{0%,8%,to{opacity:0;transform:translateY(0)}12%,22%{opacity:1;transform:translateY(0)}36%{opacity:1;transform:translateY(66px)}50%{opacity:1;transform:translateY(132px)}64%,72%{opacity:1;transform:translateY(198px)}82%,92%{opacity:0;transform:translateY(198px)}}@keyframes architecture-align{0%,65%,92%,to{opacity:0}70%,80%{opacity:.92}87%{opacity:.2}}@keyframes architecture-align-ring{0%,65%,to{opacity:0;transform:scale(.72)}70%{opacity:.9;transform:scale(.72)}80%{opacity:.38;transform:scale(1.18)}88%{opacity:0;transform:scale(1.28)}}@keyframes architecture-status-base{0%,6%,90%,to{opacity:1}8%,87%{opacity:0}}@keyframes architecture-status-1{0%,21%,9%,to{opacity:0}11%,20%{opacity:1}}@keyframes architecture-status-2{0%,23%,36%,to{opacity:0}25%,35%{opacity:1}}@keyframes architecture-status-3{0%,37%,50%,to{opacity:0}39%,49%{opacity:1}}@keyframes architecture-status-4{0%,51%,64%,to{opacity:0}53%,63%{opacity:1}}@keyframes architecture-status-5{0%,65%,85%,to{opacity:0}68%,83%{opacity:1}}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0d1117}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.muted{fill:#3d444d}.micro{font-size:10.5px;letter-spacing:1.6px;font-weight:650}.tiny{font-size:9.2px;letter-spacing:.9px}.layer{font-size:16.5px;font-weight:650;letter-spacing:-.15px}.copy{font-size:12.5px}.architecture-phase{opacity:1;animation:architecture-phase 6s ease-in-out infinite}.architecture-dependency,.architecture-plane-resolve{fill:none;opacity:0;stroke-dasharray:1;stroke-dashoffset:1}.architecture-dependency{stroke-width:2.2;stroke-linecap:round}.architecture-plane-resolve{stroke-width:2.1;stroke-linejoin:round}.architecture-step-1{animation:architecture-step-1 6s cubic-bezier(.42,0,.2,1) infinite}.architecture-step-2{animation:architecture-step-2 6s cubic-bezier(.42,0,.2,1) infinite}.architecture-step-3{animation:architecture-step-3 6s cubic-bezier(.42,0,.2,1) infinite}.architecture-step-4{animation:architecture-step-4 6s cubic-bezier(.42,0,.2,1) infinite}.architecture-signal{opacity:0;transform-box:fill-box;transform-origin:center;animation:architecture-signal 6s cubic-bezier(.42,0,.2,1) infinite}.architecture-align{opacity:0;animation:architecture-align 6s ease-in-out infinite}.architecture-align-ring{fill:none;transform-box:fill-box;transform-origin:center;animation:architecture-align-ring 6s ease-in-out infinite}.architecture-status{opacity:0}.architecture-status-base{animation:architecture-status-base 6s ease-in-out infinite}.architecture-status-1{animation:architecture-status-1 6s ease-in-out infinite}.architecture-status-2{animation:architecture-status-2 6s ease-in-out infinite}.architecture-status-3{animation:architecture-status-3 6s ease-in-out infinite}.architecture-status-4{animation:architecture-status-4 6s ease-in-out infinite}.architecture-status-5{animation:architecture-status-5 6s ease-in-out infinite}</style><defs><linearGradient id="architecture-spectrum" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#512da8"/><stop offset=".5" stop-color="#0550ae"/><stop offset="1" stop-color="#0a6759"/></linearGradient><filter id="architecture-shadow" width="150%" height="240%" x="-20%" y="-60%"><feDropShadow dx="0" dy="8" flood-color="#0d1117" flood-opacity=".08" stdDeviation="8"/></filter></defs><g data-audit-text="heading"><path stroke="#512da8" stroke-width="2" d="M54 54h34"/><text x="104" y="59" fill="#512da8" class="mono micro">ARCHITECTURE / COMPOSED</text><text x="54" y="100" font-size="28" font-weight="620" letter-spacing="-1.15">A clear path from interface to delivery.</text><text x="54" y="128" class="copy muted">Spatial layers keep system boundaries visible without turning them into boxes.</text></g><g data-audit-text="flow"><path stroke="#768390" d="M54 218h322"/><circle cx="54" cy="218" r="7" fill="#fff" stroke="#512da8" stroke-width="1.4"/><text x="54" y="249" class="mono tiny muted">INTERFACE</text><path stroke="#768390" stroke-dasharray="3 9" d="M66 218h83"/><circle cx="161" cy="218" r="7" fill="#fff" stroke="#0550ae" stroke-width="1.4"/><text x="161" y="249" class="mono tiny muted" text-anchor="middle">STATE</text><path stroke="#768390" stroke-dasharray="3 9" d="M173 218h83"/><circle cx="268" cy="218" r="7" fill="#fff" stroke="#0a6759" stroke-width="1.4"/><text x="268" y="249" class="mono tiny muted" text-anchor="middle">SERVICES</text><path stroke="#768390" stroke-dasharray="3 9" d="M280 218h83"/><circle cx="375" cy="218" r="7" fill="#fff" stroke="#7d4e00" stroke-width="1.4"/><text x="375" y="249" class="mono tiny muted" text-anchor="end">DELIVERY</text></g><g fill="none" opacity=".72"><path stroke="#768390" stroke-dasharray="3 9" d="M375 218h55v160"/><path stroke="#512da8" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 180h60"/><path stroke="#0550ae" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 246h60"/><path stroke="#0a6759" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 312h60"/><path stroke="#7d4e00" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 378h60"/><text x="430" y="408" class="mono tiny muted" text-anchor="middle">ACQUISITION SPINE</text></g><g data-audit-text="ai-copy"><text x="54" y="310" fill="#0550ae" class="mono micro">AI-ASSISTED DEVELOPMENT</text><text x="54" y="337" class="copy muted">Automation supports the path. Engineering judgment owns it.</text><path stroke="url(#architecture-spectrum)" stroke-width="2" d="M54 368h336"/></g><path fill="#fff" fill-opacity=".88" stroke="#512da8" stroke-opacity=".8" d="m500 180 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-1"><text x="530" y="186" class="layer">Interface</text><text x="878" y="184" class="mono tiny muted" text-anchor="end">REACT / ACCESSIBILITY / MOTION</text></g><circle cx="706" cy="180" r="3.6" fill="#512da8"/><path fill="#fff" fill-opacity=".88" stroke="#0550ae" stroke-opacity=".8" d="m500 246 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-2"><text x="530" y="252" class="layer">State</text><text x="878" y="250" class="mono tiny muted" text-anchor="end">TYPESCRIPT / DATA / OFFLINE</text></g><circle cx="706" cy="246" r="3.6" fill="#0550ae"/><path fill="#fff" fill-opacity=".88" stroke="#0a6759" stroke-opacity=".8" d="m500 312 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-3"><text x="530" y="318" class="layer">Services</text><text x="878" y="316" class="mono tiny muted" text-anchor="end">NODE / API / TRANSACTIONS</text></g><circle cx="706" cy="312" r="3.6" fill="#0a6759"/><path fill="#fff" fill-opacity=".88" stroke="#7d4e00" stroke-opacity=".8" d="m500 378 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-4"><text x="530" y="384" class="layer">Delivery</text><text x="878" y="382" class="mono tiny muted" text-anchor="end">TEST / PERFORMANCE / RELEASE</text></g><circle cx="706" cy="378" r="3.6" fill="#7d4e00"/><g data-audit-text="status"><path stroke="#768390" d="M54 421h852"/><text x="54" y="442" class="mono tiny muted">SYSTEM COORDINATE / INTERFACE → DELIVERY</text><text x="906" y="442" class="mono tiny muted architecture-status-base" text-anchor="end">LAYERS / ALIGNED</text></g><g aria-hidden="true"><text x="906" y="128" class="mono tiny muted architecture-phase" data-audit-text="motion-phase" text-anchor="end">ACQUIRE → TRACE → CLASSIFY → RESOLVE → QUIET</text><path stroke="#512da8" d="M430 180h60" class="architecture-dependency architecture-step-1" data-audit-geometry="motion-dependency" pathLength="1"/><path stroke="#512da8" d="m500 180 200-29 206 29-200 29Z" class="architecture-plane-resolve architecture-step-1" data-audit-geometry="motion-plane" pathLength="1"/><path stroke="#0550ae" d="M430 246h60" class="architecture-dependency architecture-step-2" data-audit-geometry="motion-dependency" pathLength="1"/><path stroke="#0550ae" d="m500 246 200-29 206 29-200 29Z" class="architecture-plane-resolve architecture-step-2" data-audit-geometry="motion-plane" pathLength="1"/><path stroke="#0a6759" d="M430 312h60" class="architecture-dependency architecture-step-3" data-audit-geometry="motion-dependency" pathLength="1"/><path stroke="#0a6759" d="m500 312 200-29 206 29-200 29Z" class="architecture-plane-resolve architecture-step-3" data-audit-geometry="motion-plane" pathLength="1"/><path stroke="#7d4e00" d="M430 378h60" class="architecture-dependency architecture-step-4" data-audit-geometry="motion-dependency" pathLength="1"/><path stroke="#7d4e00" d="m500 378 200-29 2