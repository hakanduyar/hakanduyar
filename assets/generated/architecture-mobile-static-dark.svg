<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-architecture-mobile-title v5-architecture-mobile-desc" role="img" viewBox="0 0 480 1190"><title id="v5-architecture-mobile-title">Engineering responsibility architecture</title><desc id="v5-architecture-mobile-desc">Five responsibility layers connect interface, application, services, data, and platform. A request moves down; evidence returns to a human release decision.</desc><path fill="#0a0c10" d="M0 0h480v1190H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}circle{shape-rendering:geometricPrecision}</style><path fill="#12161c" stroke="#3a444f" d="M16 0h448v1174H16z"/><text x="32" y="42" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01 / RESPONSIBILITY PLAN</text><text x="32" y="78" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650" letter-spacing="-1.1"><tspan x="32" dy="0">A request descends.</tspan><tspan x="32" dy="31">Evidence comes back.</tspan></text><text x="32" y="130" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500"><tspan x="32" dy="0">Five layers. Each names what it owns,</tspan><tspan x="32" dy="19">the contract it exposes, and the proof it returns.</tspan></text><path stroke="#3a444f" stroke-width="2" d="M50 216v704"/><path fill="#1a2028" stroke="#242b34" d="M32 188h416v166H32z"/><circle cx="50" cy="216" r="13" fill="#12161c" stroke="#3a444f"/><text x="50" y="220" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" text-anchor="middle">1</text><text x="76" y="214" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INTERFACE</text><text x="76" y="235" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500">User-facing behavior</text><text x="76" y="268" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OWNS</text><text x="76" y="287" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">React</text><text x="76" y="304" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Components and interactions</text><text x="254" y="268" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="254" y="287" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Typed component APIs</text><text x="254" y="304" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Props · states · semantics</text><text x="76" y="321" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="76" y="340" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Browser + a11y checks</text><text x="76" y="357" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Rendered behavior is inspected</text><text x="254" y="338" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Drafts components; a person reads the diff.</text><path fill="#1a2028" stroke="#242b34" d="M32 364h416v166H32z"/><circle cx="50" cy="392" r="13" fill="#12161c" stroke="#3a444f"/><text x="50" y="396" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" text-anchor="middle">2</text><text x="76" y="390" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">APPLICATION</text><text x="76" y="411" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500">Product decisions</text><text x="76" y="444" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OWNS</text><text x="76" y="463" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Next.js · state</text><text x="76" y="480" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Routing · query · forms</text><text x="254" y="444" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="254" y="463" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Server / client split</text><text x="254" y="480" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Explicit state ownership</text><text x="76" y="497" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="76" y="516" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Reproducible state</text><text x="76" y="533" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Export/import restores intent</text><text x="254" y="514" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Plans the work before code is written.</text><path fill="#171c23" stroke="#242b34" d="M32 540h416v166H32z"/><circle cx="50" cy="568" r="13" fill="#12161c" stroke="#3a444f"/><text x="50" y="572" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" text-anchor="middle">3</text><text x="76" y="566" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SERVICES</text><text x="76" y="587" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500">Rules and boundaries</text><text x="76" y="620" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OWNS</text><text x="76" y="639" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Node.js</text><text x="76" y="656" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Express / NestJS rules</text><text x="254" y="620" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="254" y="639" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">REST · JWT</text><text x="254" y="656" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Role-aware route checks</text><text x="76" y="673" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="76" y="692" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Integration tests</text><text x="76" y="709" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Exercise the API path</text><text x="254" y="690" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Runs fixed verification commands.</text><path fill="#171c23" stroke="#242b34" d="M32 716h416v166H32z"/><circle cx="50" cy="744" r="13" fill="#12161c" stroke="#3a444f"/><text x="50" y="748" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" text-anchor="middle">4</text><text x="76" y="742" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DATA</text><text x="76" y="763" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500">Durable truth</text><text x="76" y="796" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OWNS</text><text x="76" y="815" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">PostgreSQL</text><text x="76" y="832" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Transactional persistence</text><text x="254" y="796" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="254" y="815" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Prisma · Dexie</text><text x="254" y="832" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Typed and versioned schemas</text><text x="76" y="849" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="76" y="868" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Migrations are history</text><text x="76" y="885" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Recoverable upgrades</text><text x="254" y="866" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Independent review reads schema changes.</text><path fill="#171c23" stroke="#242b34" d="M32 892h416v166H32z"/><circle cx="50" cy="920" r="13" fill="#12161c" stroke="#3a444f"/><text x="50" y="924" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" text-anchor="middle">5</text><text x="76" y="918" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PLATFORM</text><text x="76" y="939" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500">Repeatable runtime</text><text x="76" y="972" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OWNS</text><text x="76" y="991" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Docker · Compose</text><text x="76" y="1008" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Packaged environments</text><text x="254" y="972" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="254" y="991" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">CI · Nginx · Linux</text><text x="254" y="1008" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Pipeline delivery gates</text><text x="76" y="1025" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="76" y="1044" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="630">Same result twice</text><text x="76" y="1061" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Manifest reproduces runtime</text><text x="254" y="1042" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Repair is bounded; release is not delegated.</text><circle cx="50" cy="920" r="5.5" fill="#88a7cd" opacity="0"/><circle cx="50" cy="230.98" r="5.5" fill="#d3b36a" opacity=".07"/><path fill="#171c23" d="M32 1080h416v70H32z"/><path fill="#d3b36a" d="M32 1080h3v70h-3z"/><text x="48" y="1105" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="590"><tspan x="48" dy="0">Request ↓ moves toward runtime.</tspan><tspan x="48" dy="20">Evidence ↑ returns to the human release gate.</tspan></text><circle cx="422" cy="1101" r="4" fill="#88a7cd"/><circle cx="422" cy="1125" r="4" fill="#d3b36a"/></svg>