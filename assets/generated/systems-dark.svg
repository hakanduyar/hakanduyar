<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="systems-dark-title systems-dark-desc" role="img" viewBox="0 0 960 500"><title id="systems-dark-title">Selected public systems mapped as a mission and relationship graph</title><desc id="systems-dark-desc">dropspot-project: Limited-stock distribution with fair, idempotent claim handling. spark: Offline planning that runs without an account or backend. stock-management-system: Role-aware inventory across the stock movement lifecycle. Hunnes-Academy-motion-system: Composable motion modules behind one declarative system.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#f0f6fc}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.muted{fill:#8b949e}.micro{font-size:10.5px;letter-spacing:1.65px;font-weight:650}.tiny{font-size:9.5px;letter-spacing:.95px}.name{font-size:17px;font-weight:650;letter-spacing:-.2px}.copy{font-size:12.5px}</style><defs><linearGradient id="systems-route" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#58a6ff"/><stop offset=".45" stop-color="#ff7b72"/><stop offset="1" stop-color="#a371f7"/></linearGradient><filter id="systems-glow" width="300%" height="300%" x="-100%" y="-100%"><feGaussianBlur result="b" stdDeviation="4"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g><path stroke="#58a6ff" stroke-width="2" d="M54 54h34"/><text x="104" y="59" fill="#58a6ff" class="mono micro">SELECTED SYSTEMS / 04</text><text x="54" y="96" font-size="28" font-weight="620" letter-spacing="-1.15">Tracked work in one mission graph.</text><text x="54" y="123" class="copy muted">Four public systems, each carrying a distinct engineering signal.</text></g><g fill="none"><path stroke="#30363d" stroke-linecap="round" stroke-width="8" d="M68 294c23-11 43-19 62-20 88-8 155 26 235-16 89-47 162 18 245 52 86 35 151-62 225-40 26 8 50 11 75 5" data-audit-geometry="trajectory" opac