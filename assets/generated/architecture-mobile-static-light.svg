<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="architecture-mobile-light-title architecture-mobile-light-desc" role="img" viewBox="0 0 390 665"><title id="architecture-mobile-light-title">Mobile spatial engineering architecture from interface through delivery</title><desc id="architecture-mobile-light-desc">Four separated spatial layers: interface, state, services, and delivery. AI-assisted development supports an accountable engineering process.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0d1117}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.muted{fill:#3d444d}.micro{font-size:10px;letter-spacing:1.3px;font-weight:650}.tiny{font-size:8.2px;letter-spacing:.65px}.layer{font-size:15.5px;font-weight:650;letter-spacing:-.15px}.copy{font-size:11.5px}</style><defs><linearGradient id="architecture-spectrum" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#512da8"/><stop offset=".5" stop-color="#0550ae"/><stop offset="1" stop-color="#0a6759"/></linearGradient><filter id="architecture-shadow" width="150%" height="240%" x="-20%" y="-60%"><feDropShadow dx="0" dy="8" flood-color="#0d1117" flood-opacity=".08" stdDeviation="8"/></filter></defs><g data-audit-text="heading"><path stroke="#512da8" stroke-width="2" d="M24 38h30"/><text x="67" y="42" fill="#512da8" class="mono micro">ARCHITECTURE / COMPOSED</text><text x="24" y="82" font-size="20.5" font-weight="620" letter-spacing="-.65">A clear path from interface to delivery.</text><text x="24" y="110" class="copy muted">Spatial layers keep system boundaries visible.</text><text x="24" y="130" class="copy muted">Each layer remains distinct, legible, and accountable.</text></g><g data-audit-text="flow"><path stroke="#768390" d="M24 170h342"/><circle cx="24" cy="170" r="6.5" fill="#fff" stroke="#512da8" stroke-width="1.4"/><text x="24" y="201" class="mono tiny muted">INTERFACE</text><circle cx="138" cy="170" r="6.5" fill="#fff" stroke="#0550ae" stroke-width="1.4"/><text x="138" y="201" class="mono tiny muted" text-anchor="middle">STATE</text><circle cx="252" cy="170" r="6.5" fill="#fff" stroke="#0a6759" stroke-width="1.4"/><text x="252" y="201" class="mono tiny muted" text-anchor="middle">SERVICES</text><circle cx="366" cy="170" r="6.5" fill="#fff" stroke="#7d4e00" stroke-width="1.4"/><text x="366" y="201" class="mono tiny muted" text-anchor="end">DELIVERY</text></g><path stroke="#768390" stroke-dasharray="3 8" d="M195 216v26"/><text x="208" y="232" class="mono tiny muted">ACQUIRE / ALIGN</text><path fill="#fff" fill-opacity=".9" stroke="#512da8" stroke-opacity=".82" d="m36 280 159-27 159 27-159 27Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-1"><text x="58" y="286" class="layer">Interface</text><text x="334" y="284" class="mono tiny muted" text-anchor="end">REACT / ACCESSIBILITY</text></g><circle cx="195" cy="280" r="3.5" fill="#512da8"/><path fill="#fff" fill-opacity=".9" stroke="#0550ae" stroke-opacity=".82" d="m36 365 159-27 159 27-159 27Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-2"><text x="58" y="371" class="layer">State</text><text x="334" y="369" class="mono tiny muted" text-anchor="end">TYPESCRIPT / DATA</text></g><circle cx="195" cy="365" r="3.5" fill="#0550ae"/><path fill="#fff" fill-opacity=".9" stroke="#0a6759" stroke-opacity=".82" d="m36 450 159-27 159 27-159 27Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-3"><text x="58" y="456" class="layer">Services</text><text x="334" y="454" class="mono tiny muted" text-anchor="end">NODE / API</text></g><circle cx="195" cy="450" r="3.5" fill="#0a6759"/><path fill="#fff" fill-opacity=".9" stroke="#7d4e00" stroke-opacity=".82" d="m36 535 159-27 159 27-159 27Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-4"><text x="58" y="541" class="layer">Delivery</text><text x="334" y="539" class="mono tiny muted" text-anchor="end">TEST / RELEASE</text></g><circle cx="195" cy="535" r="3.5" fill="#7d4e00"/><g data-audit-text="ai-copy"><path stroke="url(#architecture-spectrum)" stroke-width="2" d="M24 588h342"/><text x="24" y="614" fill="#0550ae" class="mono micro">AI-ASSISTED DEVELOPMENT</text><text x="24" y="640" class="copy muted">Automation supports the path. Engineering judgment owns it.</text></g></svg>