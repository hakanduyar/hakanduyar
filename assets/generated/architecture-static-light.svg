<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-architecture-title v5-architecture-desc" role="img" viewBox="0 0 880 790"><title id="v5-architecture-title">Engineering responsibility architecture</title><desc id="v5-architecture-desc">Five responsibility layers connect interface, application, services, data, and platform. A request moves down; evidence returns to a human release decision.</desc><path fill="#e5e7e2" d="M0 0h880v790H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}circle{shape-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M20 0h840v774H20z"/><text x="38" y="44" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01 / RESPONSIBILITY PLAN</text><text x="38" y="86" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1"><tspan x="38" dy="0">A request descends the layers.</tspan><tspan x="38" dy="37">Evidence returns to the decision.</tspan></text><text x="548" y="67" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500"><tspan x="548" dy="0">Architecture is a responsibility map:</tspan><tspan x="548" dy="19">ownership, contract, evidence, and authority.</tspan></text><path fill="#fcfcfb" stroke="#a8ada8" d="M38 153h804v520H38z"/><path fill="#f1f2ee" d="M38 153h804v45H38z"/><path stroke="#d6d8d3" d="M80 153v520"/><text x="93" y="180" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">LAYER</text><path stroke="#d6d8d3" d="M222 153v520"/><text x="235" y="180" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OWNS</text><path stroke="#d6d8d3" d="M419 153v520"/><text x="432" y="180" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><path stroke="#d6d8d3" d="M616 153v520"/><text x="629" y="180" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE / AI PARTICIPATION</text><path stroke="#a8ada8" stroke-width="2" d="M59 245.5v380"/><path fill="#edf0f2" d="M80 198h142v95H80z"/><circle cx="59" cy="245.5" r="11.5" fill="#fcfcfb" stroke="#a8ada8"/><text x="59" y="249" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">1</text><text x="93" y="227" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INTERFACE</text><text x="93" y="250" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500">User-facing behavior</text><text x="248" y="229" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">React</text><text x="248" y="252" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Components and interactions</text><text x="445" y="229" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Typed component APIs</text><text x="445" y="252" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Props · states · semantics</text><text x="642" y="225" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Browser + a11y checks</text><text x="642" y="246" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Rendered behavior is inspected</text><text x="642" y="269" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500">Drafts components; a person reads the diff.</text><path fill="#edf0f2" d="M80 293h142v95H80z"/><path stroke="#d6d8d3" d="M38 293h804"/><circle cx="59" cy="340.5" r="11.5" fill="#fcfcfb" stroke="#a8ada8"/><text x="59" y="344" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">2</text><text x="93" y="322" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">APPLICATION</text><text x="93" y="345" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500">Product decisions</text><text x="248" y="324" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Next.js · state</text><text x="248" y="347" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Routing · query · forms</text><text x="445" y="324" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Server / client split</text><text x="445" y="347" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Explicit state ownership</text><text x="642" y="320" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Reproducible state</text><text x="642" y="341" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Export/import restores intent</text><text x="642" y="364" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500">Plans the work before code is written.</text><path stroke="#d6d8d3" d="M38 388h804"/><circle cx="59" cy="435.5" r="11.5" fill="#fcfcfb" stroke="#a8ada8"/><text x="59" y="439" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">3</text><text x="93" y="417" fill="#13171b" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SERVICES</text><text x="93" y="440" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500">Rules and boundaries</text><text x="248" y="419" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Node.js</text><text x="248" y="442" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Express / NestJS rules</text><text x="445" y="419" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">REST · JWT</text><text x="445" y="442" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Role-aware route checks</text><text x="642" y="415" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Integration tests</text><text x="642" y="436" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Exercise the API path</text><text x="642" y="459" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500">Runs fixed verification commands.</text><path stroke="#d6d8d3" d="M38 483h804"/><circle cx="59" cy="530.5" r="11.5" fill="#fcfcfb" stroke="#a8ada8"/><text x="59" y="534" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">4</text><text x="93" y="512" fill="#13171b" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DATA</text><text x="93" y="535" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500">Durable truth</text><text x="248" y="514" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">PostgreSQL</text><text x="248" y="537" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Transactional persistence</text><text x="445" y="514" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Prisma · Dexie</text><text x="445" y="537" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Typed and versioned schemas</text><text x="642" y="510" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Migrations are history</text><text x="642" y="531" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Recoverable upgrades</text><text x="642" y="554" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500">Independent review reads schema changes.</text><path stroke="#d6d8d3" d="M38 578h804"/><circle cx="59" cy="625.5" r="11.5" fill="#fcfcfb" stroke="#a8ada8"/><text x="59" y="629" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">5</text><text x="93" y="607" fill="#13171b" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PLATFORM</text><text x="93" y="630" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500">Repeatable runtime</text><text x="248" y="609" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Docker · Compose</text><text x="248" y="632" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Packaged environments</text><text x="445" y="609" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">CI · Nginx · Linux</text><text x="445" y="632" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Pipeline delivery gates</text><text x="642" y="605" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="650">Same result twice</text><text x="642" y="626" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.4" font-weight="500">Manifest reproduces runtime</text><text x="642" y="649" fill="#5e666e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500">Repair is bounded; release is not delegated.</text><circle cx="59" cy="625.5" r="5.5" fill="#2b5581" opacity="0"/><circle cx="59" cy="253.59" r="5.5" fill="#7c5a0f" opacity=".07"/><path fill="#f1f2ee" d="M38 690h804v58H38z"/><path fill="#7c5a0f" d="M38 690h3v58h-3z"/><text x="54" y="718" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="600">A request descends. Evidence climbs back to the person who decides the release.</text><circle cx="676" cy="716" r="4" fill="#2b5581"/><text x="688" y="720" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">REQUEST</text><circle cx="766" cy="716" r="4" fill="#7c5a0f"/><text x="778" y="720" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text></svg>