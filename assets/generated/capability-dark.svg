<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-capability-title v5-capability-desc" role="img" viewBox="0 0 880 650"><title id="v5-capability-title">Calibrated engineering capability landscape</title><desc id="v5-capability-desc">Core expertise, applied public evidence, platform working awareness, current expansion, and supporting familiarity are separated so breadth does not dilute the primary React and TypeScript identity.</desc><path fill="#0a0c10" d="M0 0h880v650H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#12161c" stroke="#3a444f" d="M20 0h840v634H20z"/><text x="38" y="44" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04 / CAPABILITY</text><text x="38" y="86" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1"><tspan x="38" dy="0">Breadth is useful only while</tspan><tspan x="38" dy="37">the depth stays obvious.</tspan></text><text x="561" y="67" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="561" dy="0">Four calibrated tiers. Platform exposure and</tspan><tspan x="561" dy="18">in-progress learning never compete with core depth.</tspan></text><path fill="#1f262f" stroke="#242b34" d="M38 157h804v76H38z"/><path fill="#88a7cd" d="M38 157h3v76h-3z"/><text x="54" y="180" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CORE · ESTABLISHED</text><text x="54" y="206" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="660">Front-end &amp; application architecture</text><text x="333" y="185" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500"><tspan x="333" dy="0">React · TypeScript · JavaScript · Next.js · component architecture · state/data integration</tspan><tspan x="333" dy="18">accessible product interfaces</tspan></text><text x="825" y="215" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">PRIMARY IDENTITY</text><path fill="#171c23" stroke="#242b34" d="M38 241h804v76H38z"/><path fill="#3a444f" d="M38 241h3v76h-3z"/><text x="54" y="264" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">APPLIED · PUBLIC EVIDENCE</text><text x="54" y="290" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="660">Services, persistence &amp; local-first data</text><text x="333" y="269" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500"><tspan x="333" dy="0">Node.js · Express · NestJS · REST · JWT/roles · PostgreSQL · Prisma · Supabase</tspan><tspan x="333" dy="18">PWA · IndexedDB/Dexie · modern state, query and form systems</tspan></text><text x="825" y="299" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">SHOWN IN THE CASES ABOVE</text><path fill="#171c23" stroke="#242b34" d="M38 325h804v76H38z"/><path fill="#3a444f" d="M38 325h3v76h-3z"/><text x="54" y="348" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PLATFORM · WORKING AWARENESS</text><text x="54" y="374" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="660">Delivery &amp; runtime</text><text x="333" y="353" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500"><tspan x="333" dy="0">Git · GitHub · Actions · GitLab CI/CD · Docker · Compose · Nginx · Linux · Vercel · Netlify</tspan></text><text x="825" y="383" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">NOT A PRODUCTION-PLATFORM OWNERSHIP CLAIM</text><path fill="#171c23" stroke="#242b34" d="M38 409h804v76H38z"/><path fill="#d3b36a" d="M38 409h3v76h-3z"/><text x="54" y="432" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EXPANSION · IN PROGRESS</text><text x="54" y="458" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="660">Orchestration &amp; observability</text><text x="333" y="437" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500"><tspan x="333" dy="0">Kubernetes · Ansible · Grafana · n8n · model routing · local/open-model experimentation</tspan></text><text x="825" y="467" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">K9S APPEARS ONLY AS KUBERNETES TOOLING</text><path fill="#171c23" d="M38 501h804v51H38z"/><text x="54" y="522" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">WORKING FAMILIARITY · NOT CLAIMED DEPTH</text><text x="54" y="542" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500">GraphQL · WebSocket · MongoDB · Firebase · Redis · Elasticsearch · Kafka · Ant Design · Chakra · shadcn/ui · Apache · DigitalOcean</text><path stroke="#e9edf2" stroke-width="2" d="M38 576h804"/><text x="38" y="606" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="660" letter-spacing="-.4">Build the interface. Understand the system. Govern the automation.</text><text x="842" y="596" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.7" font-weight="650" letter-spacing="1" text-anchor="end"><tspan x="842" dy="0">GITHUB / HAKANDUYAR</tspan><tspan x="842" dy="17">LINKEDIN / IN/HAKANDUYAR</tspan></text></svg>