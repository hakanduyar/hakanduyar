<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="theme-control-dark-title theme-control-dark-desc" role="img" viewBox="0 0 960 120"><title id="theme-control-dark-title">GitHub light and dark appearance settings</title><desc id="theme-control-dark-desc">Open GitHub Appearance settings to choose light or dark mode. Profile visuals follow that preference automatically.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#f0f6fc}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.label{font-size:20px;font-weight:680;letter-spacing:.25px}.caption{font-size:12.5px;font-weight:560;letter-spacing:.45px}.choice{font-size:15px;font-weight:720;letter-spacing:1.4px}.light-choice,.muted{fill:#8b949e}.dark-choice{fill:#0d1117}</style><g data-audit-geometry="appearance-control"><rect width="924" height="96" x="18" y="12" fill="#161b22" fill-opacity=".72" stroke="#30363d" stroke-width="1.5" rx="24"/><path stroke="#21262d" stroke-width="1.2" d="M44 94h492"/><circle cx="526" cy="94" r="3.5" fill="#58a6ff"/><rect width="336" height="80" x="592" y="20" fill="#0d1117" stroke="#30363d" stroke-width="1.5" rx="40"/><rect width="159" height="68" x="763" y="26" fill="#58a6ff" rx="34"/><path stroke="#30363d" stroke-opacity=".7" d="M760 35v50"/><g aria-hidden="true"><circle cx="625" cy="60" r="7" fill="none" stroke="#8b949e" stroke-width="1.8"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="M637 60h6"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="m633.49 68.49 4.24 4.24"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="M625 72v6"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="m616.51 68.49-4.24 4.24"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="M613 60h-6"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="m616.51 51.51-4.24-4.24"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="M625 48v-6"/><path stroke="#8b949e" stroke-linecap="round" stroke-width="1.8" d="m633.49 51.51 4.24-4.24"/></g><path fill="none" stroke="#0d1117" stroke-linejoin="round" stroke-width="1.8" d="M801 47a16 16 0 1 0 5 21 13 13 0 0 1-5-21Z"/></g><g data-audit-text="appearance-copy"><text x="44" y="57" class="label">GITHUB APPEARANCE</text><text x="44" y="81" class="mono caption muted">Choose light or dark · opens your GitHub setting ↗</text><text x="651" y="66" class="mono choice light-choice">LIGHT</text><text x="819" y="66" class="mono choice dark-choice">DARK</text></g></svg>