<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-ai-title v5-ai-desc" role="img" viewBox="0 0 880 735"><title id="v5-ai-title">Governed AI engineering workflow</title><desc id="v5-ai-desc">A seven-step workflow moves from human specification through agent planning and implementation, deterministic verification, independent review, bounded repair, and a human release gate.</desc><path fill="#0a0c10" d="M0 0h880v735H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}circle{shape-rendering:geometricPrecision}</style><path fill="#12161c" stroke="#3a444f" d="M20 0h840v719H20z"/><text x="38" y="44" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03 / AI ENGINEERING</text><text x="38" y="86" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1"><tspan x="38" dy="0">Agents participate.</tspan><tspan x="38" dy="37">The system keeps authority.</tspan></text><text x="556" y="68" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500"><tspan x="556" dy="0">Providers are replaceable adapters.</tspan><tspan x="556" dy="19">Plans, evidence, and release authority are not.</tspan></text><path fill="#0b0e13" stroke="#3a444f" d="M38 155h246v500H38z"/><text x="60" y="184" fill="#9aa5b2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">POSITION</text><text x="60" y="230" fill="#f2f5f8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="660" letter-spacing="-.7"><tspan x="60" dy="0">Model confidence</tspan><tspan x="60" dy="28">is not system</tspan><tspan x="60" dy="28">evidence.</tspan></text><text x="60" y="338" fill="#9aa5b2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.2" font-weight="500"><tspan x="60" dy="0">Agents work inside a system whose</tspan><tspan x="60" dy="18">durable state and release authority</tspan><tspan x="60" dy="18">never depend on model output.</tspan></text><path stroke="#303842" d="M60 417h200"/><text x="60" y="446" fill="#9aa5b2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OPERATING LAW</text><text x="60" y="477" fill="#f2f5f8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600"><tspan x="60" dy="0">Model text is recorded</tspan><tspan x="60" dy="20">as evidence — never read</tspan><tspan x="60" dy="20">as acceptance.</tspan></text><path fill="#11161d" stroke="#d3b36a" d="M60 579h200v48H60z"/><text x="160" y="598" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" letter-spacing=".9" text-anchor="middle"><tspan x="160" dy="0">ZERO AUTONOMOUS</tspan><tspan x="160" dy="14">RELEASE AUTHORITY</tspan></text><text x="300" y="169" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">OBJECTIVE → ACCOUNTABLE RELEASE</text><path stroke="#3a444f" stroke-width="2" d="M320 202v330"/><path fill="#171c23" stroke="#242b34" d="M300 186h542v46H300z"/><circle cx="320" cy="209" r="5.5" fill="#d3b36a" opacity=".72"/><text x="342" y="205" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="381" y="207" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Specify</text><text x="482" y="207" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Objective · constraints · acceptance criteria</text><text x="828" y="205" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN</text><path fill="#171c23" stroke="#242b34" d="M300 241h542v46H300z"/><circle cx="320" cy="264" r="5.5" fill="#88a7cd" opacity=".72"/><text x="342" y="260" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="381" y="262" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Plan</text><text x="482" y="262" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Dependency graph · deterministic validation</text><text x="828" y="260" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">AGENT</text><path fill="#171c23" stroke="#242b34" d="M300 296h542v46H300z"/><circle cx="320" cy="319" r="5.5" fill="#d3b36a" opacity=".72"/><text x="342" y="315" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="381" y="317" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Approve</text><text x="482" y="317" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Approval binds to one plan revision</text><text x="828" y="315" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN</text><path fill="#171c23" stroke="#242b34" d="M300 351h542v46H300z"/><circle cx="320" cy="374" r="5.5" fill="#88a7cd" opacity=".72"/><text x="342" y="370" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04</text><text x="381" y="372" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Implement</text><text x="482" y="372" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Scoped worker · default-deny environment</text><text x="828" y="370" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">AGENT</text><path fill="#171c23" stroke="#242b34" d="M300 406h542v46H300z"/><circle cx="320" cy="429" r="5.5" fill="#858f9d" opacity=".72"/><text x="342" y="425" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">05</text><text x="381" y="427" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Verify</text><text x="482" y="427" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Fixed command and argv · process facts</text><text x="828" y="425" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">PROCESS</text><path fill="#171c23" stroke="#242b34" d="M300 461h542v46H300z"/><circle cx="320" cy="484" r="5.5" fill="#88a7cd" opacity=".72"/><text x="342" y="480" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">06</text><text x="381" y="482" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Review</text><text x="482" y="482" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Independent principal · fail-closed verdict</text><text x="828" y="480" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">AGENT</text><path fill="#2e2e2c" stroke="#d3b36a" d="M300 516h542v46H300z"/><circle cx="320" cy="539" r="8.5" fill="#d3b36a"/><text x="342" y="535" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">07</text><text x="381" y="537" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="670">Release</text><text x="482" y="537" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.3" font-weight="500">Content-addressed evidence snapshot</text><text x="828" y="535" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN</text><path fill="#171c23" stroke="#242b34" d="M300 578h542v49H300z"/><text x="316" y="599" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">REPAIR ↺</text><text x="408" y="599" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Changes required returns to implementation for a bounded number of cycles.</text><text x="826" y="599" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">BOUNDED</text><path fill="#171c23" d="M300 639h542v62H300z"/><path fill="#d3b36a" d="M300 639h3v62h-3z"/><text x="316" y="662" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500"><tspan x="316" dy="0">A newer implementation invalidates prior verification, review, and approval.</tspan><tspan x="316" dy="17">Nothing carries forward on reputation.</tspan></text><text x="826" y="677" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN RELEASE GATE</text></svg>