<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-capability-title v5-capability-desc" role="img" viewBox="0 0 880 280"><title id="v5-capability-title">Compact calibrated engineering capability landscape</title><desc id="v5-capability-desc">Core React and TypeScript depth, applied systems breadth, and current expansion are shown as deliberately unequal visual tiers.</desc><path fill="#e5e7e2" d="M0 0h880v280H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M20 0h840v264H20z"/><text x="38" y="40" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04 / CAPABILITY</text><text x="38" y="82" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1"><tspan x="38" dy="0">Depth first. Breadth calibrated.</tspan></text><text x="590" y="67" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500">Three visual tiers. Deliberately unequal.</text><text x="38" y="155" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CORE</text><path fill="#dfe4e4" stroke="#2b5581" d="M138 133h170.75v37H138z"/><text x="223.38" y="157" fill="#13171b" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="640" text-anchor="middle">React</text><path fill="#f1f2ee" stroke="#2b5581" d="M315.75 133H486.5v37H315.75z"/><text x="401.13" y="157" fill="#13171b" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="640" text-anchor="middle">TypeScript</text><path fill="#f1f2ee" stroke="#2b5581" d="M493.5 133h170.75v37H493.5z"/><text x="578.88" y="157" fill="#13171b" font-family="'SFMono-Regular',Consolas,'Liberation Mono'