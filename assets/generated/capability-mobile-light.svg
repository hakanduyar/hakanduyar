<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-capability-mobile-title v5-capability-mobile-desc" role="img" viewBox="0 0 480 985"><title id="v5-capability-mobile-title">Calibrated engineering capability landscape</title><desc id="v5-capability-mobile-desc">Core expertise, applied public evidence, platform working awareness, current expansion, and supporting familiarity are separated so breadth does not dilute the primary React and TypeScript identity.</desc><path fill="#e5e7e2" d="M0 0h480v985H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M16 0h448v969H16z"/><text x="32" y="42" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04 / CAPABILITY</text><text x="32" y="78" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650" letter-spacing="-1.1"><tspan x="32" dy="0">Depth stays obvious.</tspan><tspan x="32" dy="31">Breadth stays calibrated.</tspan></text><text x="32" y="131" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="500"><tspan x="32" dy="0">Established work, applied evidence, platform awareness,</tspan><tspan x="32" dy="18">and current expansion are deliberately not equal.</tspan></text><path fill="#e3e7e6" stroke="#d6d8d3" d="M32 190h416v148H32z"/><path fill="#2b5581" d="M32 190h3v148h-3z"/><text x="49" y="215" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CORE · ESTABLISHED</text><text x="49" y="242" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="660">Front-end &amp; application architecture</text><text x="49" y="270" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500"><tspan x="49" dy="0">React · TypeScript · JavaScript · Next.js</tspan><tspan x="49" dy="18">component architecture · state/data integration</tspan><tspan x="49" dy="18">accessible product interfaces</tspan></text><text x="431" y="322" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">PRIMARY IDENTITY</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 348h416v168H32z"/><path fill="#a8ada8" d="M32 348h3v168h-3z"/><text x="49" y="373" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">APPLIED · PUBLIC EVIDENCE</text><text x="49" y="400" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="660">Services, persistence &amp; local-first data</text><text x="49" y="428" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500"><tspan x="49" dy="0">Node.js · Express · NestJS · REST · JWT / roles</tspan><tspan x="49" dy="18">PostgreSQL · Prisma · Supabase · PWA</tspan><tspan x="49" dy="18">IndexedDB / Dexie · state/query/form systems</tspan></text><text x="431" y="500" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">SHOWN IN THE CASES ABOVE</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 526h416v148H32z"/><path fill="#a8ada8" d="M32 526h3v148h-3z"/><text x="49" y="551" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PLATFORM · WORKING AWARENESS</text><text x="49" y="578" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="660">Delivery &amp; runtime</text><text x="49" y="606" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500"><tspan x="49" dy="0">Git · GitHub · Actions · GitLab CI/CD</tspan><tspan x="49" dy="18">Docker · Compose · Nginx · Linux</tspan><tspan x="49" dy="18">Vercel · Netlify</tspan></text><text x="431" y="658" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">NOT A PRODUCTION-PLATFORM OWNERSHIP CLAIM</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 684h416v148H32z"/><path fill="#7c5a0f" d="M32 684h3v148h-3z"/><text x="49" y="709" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EXPANSION · IN PROGRESS</text><text x="49" y="736" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="660">Orchestration &amp; observability</text><text x="49" y="764" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="500"><tspan x="49" dy="0">Kubernetes · Ansible · Grafana · n8n</tspan><tspan x="49" dy="18">model routing · local/open models</tspan><tspan x="49" dy="18">K9s only as Kubernetes tooling</tspan></text><text x="431" y="816" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">K9S APPEARS ONLY AS KUBERNETES TOOLING</text><path fill="#f1f2ee" d="M32 842h416v68H32z"/><text x="49" y="864" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">WORKING FAMILIARITY · NOT CLAIMED DEPTH</text><text x="49" y="884" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.4" font-weight="500"><tspan x="49" dy="0">GraphQL · WebSocket · MongoDB · Firebase · Redis · Elasticsearch · Kafka</tspan><tspan x="49" dy="16">Ant Design · Chakra · shadcn/ui · Apache · DigitalOcean</tspan></text><path stroke="#13171b" stroke-width="2" d="M32 928h416"/><text x="32" y="955" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.7" font-weight="650">Build the interface. Understand the system. Govern the automation.</text></svg>