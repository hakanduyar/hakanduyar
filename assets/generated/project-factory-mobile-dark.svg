<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-factory-mobile-title v5-project-factory-mobile-desc" role="img" viewBox="0 0 480 1010"><title id="v5-project-factory-mobile-title">01 — Software Factory</title><desc id="v5-project-factory-mobile-desc">Agents can produce work. They cannot grant it authority. A durable control plane keeps planning, execution, verification, review, and release as separate responsibilities. Not claimed: GitHub issue/PR automation, n8n orchestration, deployment, publishing, or a completed control-room UI.</desc><path fill="#0a0c10" d="M0 0h480v1010H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#0a0c10" d="M16 0h448v138H16z"/><text x="30" y="38" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02 / APPLICATIONS</text><text x="30" y="74" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650" letter-spacing="-1.1"><tspan x="30" dy="0">Four systems.</tspan><tspan x="30" dy="31">Four failure boundaries.</tspan></text><path fill="#12161c" stroke="#3a444f" d="M16 150h448v860H16z"/><text x="32" y="174" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="74" y="176" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="670" letter-spacing="-.9">Software Factory</text><text x="32" y="206" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">GOVERNED AGENTIC CONTROL PLANE</text><path stroke="#242b34" d="M32 221h416"/><path fill="#171c23" stroke="#3a444f" d="M32 236h27v22H32z"/><text x="45.5" y="251" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#88a7cd" stroke="#88a7cd" d="M63 236h27v22H63z"/><text x="76.5" y="251" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#88a7cd" stroke="#88a7cd" d="M94 236h27v22H94z"/><text x="107.5" y="251" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#88a7cd" stroke="#88a7cd" d="M125 236h27v22h-27z"/><text x="138.5" y="251" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#88a7cd" stroke="#88a7cd" d="M156 236h27v22h-27z"/><text x="169.5" y="251" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="204" y="251" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">APPLICATION → PLATFORM</text><text x="32" y="288" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="650" letter-spacing="-.4"><tspan x="32" dy="0">Agents can produce work.</tspan><tspan x="32" dy="21">They cannot grant it authority.</tspan></text><text x="32" y="341" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500"><tspan x="32" dy="0">A durable control plane separates planning, execution,</tspan><tspan x="32" dy="18">verification, review, and human release.</tspan></text><path fill="#1b222a" stroke="#3a444f" d="M32 382h416v134H32z"/><text x="48" y="406" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DURABLE DOMAIN · SQLITE</text><path fill="#12161c" stroke="#3a444f" d="M48 424h50v23H48z"/><text x="57" y="440" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">plans</text><path fill="#12161c" stroke="#3a444f" d="M104 424h73.8v23H104z"/><text x="113" y="440" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">revisions</text><path fill="#12161c" stroke="#3a444f" d="M183.8 424h80v23h-80z"/><text x="192.8" y="440" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">work items</text><path fill="#12161c" stroke="#3a444f" d="M269.8 424h50v23h-50z"/><text x="278.8" y="440" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">runs</text><path fill="#12161c" stroke="#3a444f" d="M48 454h148.2v23H48z"/><text x="57" y="470" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">verification evidence</text><path fill="#12161c" stroke="#3a444f" d="M202.2 454h61.4v23h-61.4z"/><text x="211.2" y="470" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">reviews</text><path fill="#12161c" stroke="#3a444f" d="M269.6 454h73.8v23h-73.8z"/><text x="278.6" y="470" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">approvals</text><path fill="#12161c" stroke="#3a444f" d="M48 484h111v23H48z"/><text x="57" y="500" fill="#e9edf2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="600">release lineage</text><path fill="#171c23" stroke="#3a444f" d="M32 516h416v60H32z"/><text x="48" y="538" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">PROVIDER-NEUTRAL WORKER PORTS</text><text x="48" y="559" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DOMAIN DOES NOT KNOW THE VENDOR</text><path fill="#12161c" stroke="#3a444f" d="M32 576h416v112H32z"/><text x="48" y="601" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DISPOSABLE WORKERS · PROCESS ADAPTERS</text><path fill="#171c23" stroke="#3a444f" d="M48 615h88v24H48z"/><text x="60" y="632" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.2" font-weight="600">Codex CLI</text><path fill="#171c23" stroke="#3a444f" d="M143 615h115v24H143z"/><text x="155" y="632" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.2" font-weight="600">Claude Code CLI</text><text x="48" y="663" fill="#858f9d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Workspace-scoped · default deny · replaceable</text><path stroke="#242b34" d="M32 698h416"/><text x="32" y="727" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">DURABILITY</text><text x="145" y="728" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Workers are disposable.</text><text x="145" y="747" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">The domain above them is not.</text><path stroke="#242b34" d="M32 769h416"/><text x="32" y="788" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">FAIL CLOSED</text><text x="145" y="789" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Verdicts parse strictly.</text><text x="145" y="808" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Ambiguous output never becomes a pass.</text><path stroke="#242b34" d="M32 830h416"/><text x="32" y="849" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SUPERVISION</text><text x="145" y="850" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Zero autonomous spend.</text><text x="145" y="869" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Resource and backoff policy persist.</text><path fill="#171c23" stroke="#3a444f" d="M32 901h416v70H32z"/><path fill="#d3b36a" d="M32 901h3v70h-3z"/><text x="48" y="921" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">NOT CLAIMED</text><text x="48" y="942" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500"><tspan x="48" dy="0">GitHub PR automation · n8n · deployment · publishing.</tspan><tspan x="48" dy="13.52">No completed control-room UI is claimed.</tspan></text></svg>