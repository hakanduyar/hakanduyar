<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-ledger-mobile-title v5-project-ledger-mobile-desc" role="img" viewBox="0 0 480 820"><title id="v5-project-ledger-mobile-title">04 — JointLedger</title><desc id="v5-project-ledger-mobile-desc">A shared ledger is a permissions problem before it is a screen. Two evidenced contributions to an upstream accounting application: a Docker/PostgreSQL runtime and an unreleased shared-book backend extension. Inherited, not authored: upstream engine and Vue UI. No shared-book frontend, selector, or completed invitation flow.</desc><path fill="#e5e7e2" d="M0 0h480v820H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M16 0h448v820H16z"/><text x="32" y="24" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04</text><text x="74" y="26" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="670" letter-spacing="-.9">JointLedger</text><text x="32" y="56" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">BACKEND EXTENSION · RUNTIME</text><path stroke="#d6d8d3" d="M32 71h416"/><path fill="#f1f2ee" stroke="#a8ada8" d="M32 86h27v22H32z"/><text x="45.5" y="101" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#f1f2ee" stroke="#a8ada8" d="M63 86h27v22H63z"/><text x="76.5" y="101" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#2b5581" stroke="#2b5581" d="M94 86h27v22H94z"/><text x="107.5" y="101" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#2b5581" stroke="#2b5581" d="M125 86h27v22h-27z"/><text x="138.5" y="101" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#2b5581" stroke="#2b5581" d="M156 86h27v22h-27z"/><text x="169.5" y="101" fill="#e5e7e2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="204" y="101" fill="#525c65" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SERVICES → PLATFORM · BACKEND ONLY</text><text x="32" y="138" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="650" letter-spacing="-.4"><tspan x="32" dy="0">A shared ledger is a permissions</tspan><tspan x="32" dy="21">problem before it is a screen.</tspan></text><text x="32" y="191" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500"><tspan x="32" dy="0">Docker/PostgreSQL runtime plus an unreleased</tspan><tspan x="32" dy="18">shared-book backend extension to upstream code.</tspan></text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 232h416v57H32z"/><text x="45" y="252" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="83" y="253" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Book domain</text><text x="83" y="273" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Book · member · invitation models</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 299h416v57H32z"/><text x="45" y="319" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="83" y="320" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Services and APIs</text><text x="83" y="340" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Owner / editor / viewer checks</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 366h416v57H32z"/><text x="45" y="386" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="83" y="387" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Book scoping</text><text x="83" y="407" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Accounts · categories · tags by book</text><path stroke="#d6d8d3" d="M32 442h416"/><text x="32" y="469" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">MIGRATION</text><text x="145" y="470" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Backfill is idempotent.</text><text x="145" y="489" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">A second run creates no duplicate.</text><path stroke="#d6d8d3" d="M32 511h416"/><text x="32" y="530" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">RUNTIME</text><text x="145" y="531" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Compose + PostgreSQL.</text><text x="145" y="550" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Persistent volume and verified local environment.</text><path stroke="#d6d8d3" d="M32 572h416"/><text x="32" y="591" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">STATUS</text><text x="145" y="592" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Four commits ahead.</text><text x="145" y="611" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Feature branch; unmerged and unreleased.</text><path fill="#f1f2ee" stroke="#a8ada8" d="M32 645h416v90H32z"/><path fill="#7c5a0f" d="M32 645h3v90h-3z"/><text x="48" y="665" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INHERITED / SCOPE BOUNDARY</text><text x="48" y="687" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500"><tspan x="48" dy="0">Upstream engine and Vue UI are not Hakan’s work.</tspan><tspan x="48" dy="17">No shared-book frontend, selector, or complete invitation flow.</tspan></text></svg>