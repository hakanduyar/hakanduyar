<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-project-layers-mobile-title v5-project-layers-mobile-desc" role="img" viewBox="0 0 480 760"><title id="v5-project-layers-mobile-title">03 — Built in Layers</title><desc id="v5-project-layers-mobile-desc">Content cannot publish itself past its own contract. A typed content pipeline where accessibility is delivery evidence rather than an assertion. Scope: architecture proof, not the subject of the profile.</desc><path fill="#0a0c10" d="M0 0h480v760H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}</style><path fill="#12161c" stroke="#3a444f" d="M16 0h448v760H16z"/><text x="32" y="24" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="74" y="26" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="670" letter-spacing="-.9">Built in Layers</text><text x="32" y="56" fill="#88a7cd" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">TYPED CONTENT SYSTEM</text><path stroke="#242b34" d="M32 71h416"/><path fill="#88a7cd" stroke="#88a7cd" d="M32 86h27v22H32z"/><text x="45.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">I</text><path fill="#88a7cd" stroke="#88a7cd" d="M63 86h27v22H63z"/><text x="76.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">A</text><path fill="#171c23" stroke="#3a444f" d="M94 86h27v22H94z"/><text x="107.5" y="101" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">S</text><path fill="#88a7cd" stroke="#88a7cd" d="M125 86h27v22h-27z"/><text x="138.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">D</text><path fill="#88a7cd" stroke="#88a7cd" d="M156 86h27v22h-27z"/><text x="169.5" y="101" fill="#0a0c10" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" text-anchor="middle">P</text><text x="204" y="101" fill="#939da9" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">INTERFACE → PLATFORM</text><text x="32" y="138" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="650" letter-spacing="-.4"><tspan x="32" dy="0">Content cannot publish itself</tspan><tspan x="32" dy="21">past its own contract.</tspan></text><text x="32" y="191" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="500"><tspan x="32" dy="0">Typed content with build-time schema gates and</tspan><tspan x="32" dy="18">checkable accessibility evidence.</tspan></text><path fill="#171c23" stroke="#242b34" d="M32 232h416v57H32z"/><text x="45" y="252" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="83" y="253" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Typed MDX</text><text x="83" y="273" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Gray Matter + Zod frontmatter</text><path fill="#171c23" stroke="#242b34" d="M32 299h416v57H32z"/><text x="45" y="319" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="83" y="320" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Publication gates</text><text x="83" y="340" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">Invalid content fails the build</text><path fill="#171c23" stroke="#242b34" d="M32 366h416v57H32z"/><text x="45" y="386" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="83" y="387" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.8" font-weight="650">Server-first render</text><text x="83" y="407" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500">RSC + SSG · progressive enhancement</text><path stroke="#242b34" d="M32 442h416"/><text x="32" y="469" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">CONTRACT</text><text x="145" y="470" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Frontmatter is a schema.</text><text x="145" y="489" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">A broken document stops the build.</text><path stroke="#242b34" d="M32 511h416"/><text x="32" y="530" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">BOUNDARY</text><text x="145" y="531" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Server-first by default.</text><text x="145" y="550" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Interactivity earns its cost.</text><path stroke="#242b34" d="M32 572h416"/><text x="32" y="591" fill="#858f9d" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">EVIDENCE</text><text x="145" y="592" fill="#e9edf2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.8" font-weight="650">Playwright and axe run.</text><text x="145" y="611" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.9" font-weight="500">Accessibility stays checkable.</text><path fill="#171c23" stroke="#3a444f" d="M32 645h416v70H32z"/><path fill="#d3b36a" d="M32 645h3v70h-3z"/><text x="48" y="665" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">SCOPE BOUNDARY</text><text x="48" y="687" fill="#939da9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.7" font-weight="500"><tspan x="48" dy="0">Architecture proof — deliberately</tspan><tspan x="48" dy="17">not the subject of the profile.</tspan></text></svg>