<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-ai-mobile-title v5-ai-mobile-desc" role="img" viewBox="0 0 480 560"><title id="v5-ai-mobile-title">Governed AI engineering workflow</title><desc id="v5-ai-mobile-desc">Specify, plan, approve, implement, verify, independently review, repair when required, and release through a human gate.</desc><path fill="#e5e7e2" d="M0 0h480v560H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}circle,path{shape-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M16 0h448v544H16z"/><text x="32" y="40" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03 / AI ENGINEERING</text><text x="32" y="76" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650" letter-spacing="-1.1"><tspan x="32" dy="0">Governed workflow.</tspan><tspan x="32" dy="31">Human release.</tspan></text><text x="32" y="126" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.2" font-weight="500">Execution is assisted. Evidence and authority persist.</text><path stroke="#a8ada8" stroke-width="2" d="M49 177v301"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 158h416v36H32z"/><circle cx="49" cy="176" r="5" fill="#7c5a0f"/><text x="72" y="172" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="110" y="180" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Specify</text><text x="430" y="180" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 201h416v36H32z"/><circle cx="49" cy="219" r="5" fill="#2b5581"/><text x="72" y="215" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="110" y="223" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Plan</text><text x="430" y="223" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">AGENT</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 244h416v36H32z"/><circle cx="49" cy="262" r="5" fill="#7c5a0f"/><text x="72" y="258" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="110" y="266" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Approve</text><text x="430" y="266" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 287h416v36H32z"/><circle cx="49" cy="305" r="5" fill="#2b5581"/><text x="72" y="301" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04</text><text x="110" y="309" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Implement</text><text x="430" y="309" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">AGENT</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 330h416v36H32z"/><circle cx="49" cy="348" r="5" fill="#5e666e"/><text x="72" y="344" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">05</text><text x="110" y="352" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Verify</text><text x="430" y="352" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">PROCESS</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 373h416v36H32z"/><circle cx="49" cy="391" r="5" fill="#2b5581"/><text x="72" y="387" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">06</text><text x="110" y="395" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Review</text><text x="430" y="395" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">INDEPENDENT</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 416h416v36H32z"/><circle cx="49" cy="434" r="5" fill="#2b5581"/><text x="72" y="430" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">07</text><text x="110" y="438" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Repair</text><text x="430" y="438" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">BOUNDED</text><path fill="#e2ded1" stroke="#7c5a0f" d="M32 459h416v36H32z"/><circle cx="49" cy="477" r="8" fill="#7c5a0f"/><text x="72" y="473" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">08</text><text x="110" y="481" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="670">Release</text><text x="430" y="481" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35" text-anchor="end">HUMAN GATE</text><path fill="none" stroke="#2b5581" stroke-dasharray="4 4" stroke-width="1.5" d="M430 500c-65 14-165 14-225 0"/><path fill="#2b5581" d="m205 500 7-2-3 7z"/><path fill="#f1f2ee" d="M32 520h416v24H32z"/><text x="48" y="537" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">REPAIR LOOPS BACK. RELEASE NEVER DELEGATES.</text></svg>