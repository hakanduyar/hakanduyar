<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="v5-ai-mobile-title v5-ai-mobile-desc" role="img" viewBox="0 0 480 1060"><title id="v5-ai-mobile-title">Governed AI engineering workflow</title><desc id="v5-ai-mobile-desc">A seven-step workflow moves from human specification through agent planning and implementation, deterministic verification, independent review, bounded repair, and a human release gate.</desc><path fill="#e5e7e2" d="M0 0h480v1060H0z"/><style>text{font-kerning:normal;text-rendering:geometricPrecision}circle{shape-rendering:geometricPrecision}</style><path fill="#fcfcfb" stroke="#a8ada8" d="M16 0h448v1044H16z"/><text x="32" y="42" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03 / AI ENGINEERING</text><text x="32" y="78" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650" letter-spacing="-1.1"><tspan x="32" dy="0">Agents participate.</tspan><tspan x="32" dy="31">The system keeps authority.</tspan></text><text x="32" y="131" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.2" font-weight="500"><tspan x="32" dy="0">The workflow matters more than tool brands.</tspan><tspan x="32" dy="19">Providers are adapters; evidence and authority persist.</tspan></text><path fill="#0b0e13" stroke="#3a444f" d="M32 190h416v146H32z"/><text x="50" y="216" fill="#9aa5b2" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">POSITION</text><text x="50" y="249" fill="#f2f5f8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="660" letter-spacing="-.5"><tspan x="50" dy="0">Model confidence is not</tspan><tspan x="50" dy="24">system evidence.</tspan></text><text x="50" y="312" fill="#d3b36a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" letter-spacing="1">ZERO AUTONOMOUS RELEASE AUTHORITY</text><path stroke="#a8ada8" stroke-width="2" d="M55 389v402"/><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 365h416v57H32z"/><circle cx="55" cy="393" r="6" fill="#7c5a0f" opacity=".72"/><text x="76" y="385" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">01</text><text x="113" y="387" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Specify</text><text x="113" y="407" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Objective · constraints · acceptance criteria</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 432h416v57H32z"/><circle cx="55" cy="460" r="6" fill="#2b5581" opacity=".72"/><text x="76" y="452" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">02</text><text x="113" y="454" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Plan</text><text x="113" y="474" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Dependency graph · deterministic validation</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 499h416v57H32z"/><circle cx="55" cy="527" r="6" fill="#7c5a0f" opacity=".72"/><text x="76" y="519" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">03</text><text x="113" y="521" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Approve</text><text x="113" y="541" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Approval binds to one plan revision</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 566h416v57H32z"/><circle cx="55" cy="594" r="6" fill="#2b5581" opacity=".72"/><text x="76" y="586" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">04</text><text x="113" y="588" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Implement</text><text x="113" y="608" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Scoped worker · default-deny environment</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 633h416v57H32z"/><circle cx="55" cy="661" r="6" fill="#5e666e" opacity=".72"/><text x="76" y="653" fill="#5e666e" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">05</text><text x="113" y="655" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Verify</text><text x="113" y="675" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Fixed command and argv · process facts</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 700h416v57H32z"/><circle cx="55" cy="728" r="6" fill="#2b5581" opacity=".72"/><text x="76" y="720" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">06</text><text x="113" y="722" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Review</text><text x="113" y="742" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Independent principal · fail-closed verdict</text><path fill="#e3e0d3" stroke="#7c5a0f" d="M32 767h416v57H32z"/><circle cx="55" cy="795" r="9" fill="#7c5a0f"/><text x="76" y="787" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">07</text><text x="113" y="789" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="670">Release</text><text x="113" y="809" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.1" font-weight="500">Content-addressed evidence snapshot</text><path fill="#f1f2ee" stroke="#d6d8d3" d="M32 838h416v64H32z"/><text x="48" y="860" fill="#2b5581" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">REPAIR ↺</text><text x="48" y="881" fill="#525c65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.2" font-weight="500"><tspan x="48" dy="0">Changes required returns to implementation.</tspan><tspan x="48" dy="16">The loop is bounded.</tspan></text><path fill="#f1f2ee" d="M32 914h416v77H32z"/><path fill="#7c5a0f" d="M32 914h3v77h-3z"/><text x="48" y="937" fill="#7c5a0f" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="650" letter-spacing="1.35">HUMAN RELEASE GATE</text><text x="48" y="959" fill="#13171b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="580"><tspan x="48" dy="0">A newer implementation invalidates prior evidence.</tspan><tspan x="48" dy="17">Nothing carries forward on reputation.</tspan></text></svg>