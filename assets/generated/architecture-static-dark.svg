<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="architecture-dark-title architecture-dark-desc" role="img" viewBox="0 0 960 460"><title id="architecture-dark-title">Spatial engineering architecture from interface through delivery</title><desc id="architecture-dark-desc">Four connected layers: interface, state, services, and delivery. AI-assisted development supports the process while engineering judgment remains accountable.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#f0f6fc}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.muted{fill:#8b949e}.micro{font-size:10.5px;letter-spacing:1.6px;font-weight:650}.tiny{font-size:9.2px;letter-spacing:.9px}.layer{font-size:16.5px;font-weight:650;letter-spacing:-.15px}.copy{font-size:12.5px}</style><defs><linearGradient id="architecture-spectrum" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a371f7"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#56d4ad"/></linearGradient><filter id="architecture-shadow" width="150%" height="240%" x="-20%" y="-60%"><feDropShadow dx="0" dy="8" flood-color="#f0f6fc" flood-opacity=".08" stdDeviation="8"/></filter></defs><g data-audit-text="heading"><path stroke="#a371f7" stroke-width="2" d="M54 54h34"/><text x="104" y="59" fill="#a371f7" class="mono micro">ARCHITECTURE / COMPOSED</text><text x="54" y="100" font-size="28" font-weight="620" letter-spacing="-1.15">A clear path from interface to delivery.</text><text x="54" y="128" class="copy muted">Spatial layers keep system boundaries visible without turning them into boxes.</text></g><g data-audit-text="flow"><path stroke="#30363d" d="M54 218h322"/><circle cx="54" cy="218" r="7" fill="#0d1117" stroke="#a371f7" stroke-width="1.4"/><text x="54" y="249" class="mono tiny muted">INTERFACE</text><path stroke="#30363d" stroke-dasharray="3 9" d="M66 218h83"/><circle cx="161" cy="218" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><text x="161" y="249" class="mono tiny muted" text-anchor="middle">STATE</text><path stroke="#30363d" stroke-dasharray="3 9" d="M173 218h83"/><circle cx="268" cy="218" r="7" fill="#0d1117" stroke="#56d4ad" stroke-width="1.4"/><text x="268" y="249" class="mono tiny muted" text-anchor="middle">SERVICES</text><path stroke="#30363d" stroke-dasharray="3 9" d="M280 218h83"/><circle cx="375" cy="218" r="7" fill="#0d1117" stroke="#d29922" stroke-width="1.4"/><text x="375" y="249" class="mono tiny muted" text-anchor="end">DELIVERY</text></g><g fill="none" opacity=".72"><path stroke="#30363d" stroke-dasharray="3 9" d="M375 218h55v160"/><path stroke="#a371f7" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 180h60"/><path stroke="#58a6ff" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 246h60"/><path stroke="#56d4ad" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 312h60"/><path stroke="#d29922" stroke-dasharray="3 9" stroke-opacity=".55" d="M430 378h60"/><text x="430" y="408" class="mono tiny muted" text-anchor="middle">ACQUISITION SPINE</text></g><g data-audit-text="ai-copy"><text x="54" y="310" fill="#58a6ff" class="mono micro">AI-ASSISTED DEVELOPMENT</text><text x="54" y="337" class="copy muted">Automation supports the path. Engineering judgment owns it.</text><path stroke="url(#architecture-spectrum)" stroke-width="2" d="M54 368h336"/></g><path fill="#0d1117" fill-opacity=".88" stroke="#a371f7" stroke-opacity=".8" d="m500 180 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-1"><text x="530" y="186" class="layer">Interface</text><text x="878" y="184" class="mono tiny muted" text-anchor="end">REACT / ACCESSIBILITY / MOTION</text></g><circle cx="706" cy="180" r="3.6" fill="#a371f7"/><path fill="#0d1117" fill-opacity=".88" stroke="#58a6ff" stroke-opacity=".8" d="m500 246 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-2"><text x="530" y="252" class="layer">State</text><text x="878" y="250" class="mono tiny muted" text-anchor="end">TYPESCRIPT / DATA / OFFLINE</text></g><circle cx="706" cy="246" r="3.6" fill="#58a6ff"/><path fill="#0d1117" fill-opacity=".88" stroke="#56d4ad" stroke-opacity=".8" d="m500 312 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-3"><text x="530" y="318" class="layer">Services</text><text x="878" y="316" class="mono tiny muted" text-anchor="end">NODE / API / TRANSACTIONS</text></g><circle cx="706" cy="312" r="3.6" fill="#56d4ad"/><path fill="#0d1117" fill-opacity=".88" stroke="#d29922" stroke-opacity=".8" d="m500 378 200-29 206 29-200 29Z" data-audit-geometry="plane" filter="url(#architecture-shadow)"/><g data-audit-text="layer-4"><text x="530" y="384" class="layer">Delivery</text><text x="878" y="382" class="mono tiny muted" text-anchor="end">TEST / PERFORMANCE / RELEASE</text></g><circle cx="706" cy="378" r="3.6" fill="#d29922"/><g data-audit-text="status"><path stroke="#30363d" d="M54 421h852"/><text x="54" y="442" class="mono tiny muted">SYSTEM COORDINATE / INTERFACE → DELIVERY</text><text x="906" y="442" class="mono tiny muted" text-anchor="end">LAYERS / ALIGNED</text></g></svg>