<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="hero-light-motion-title hero-light-motion-desc" role="img" viewBox="0 0 960 470"><title id="hero-light-motion-title">Hakan Duyar engineering system — three-mode animated hero</title><desc id="hero-light-motion-desc">A single twelve-second loop transitions from orbital flight calibration to a relationship signal field, then to spatial architecture layers, before returning to flight.</desc><style>@keyframes flight-state{0%,26%,to{opacity:1;transform:translateY(0)}31%,95%{opacity:0;transform:translateY(-8px)}}@keyframes signal-state{0%,27%{opacity:0;transform:scale(.97)}33%,59%{opacity:1;transform:scale(1)}65%,to{opacity:0;transform:scale(1.02)}}@keyframes spatial-state{0%,60%{opacity:0;transform:translateY(10px)}67%,92%{opacity:1;transform:translateY(0)}98%,to{opacity:0;transform:translateY(-8px)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes orbit-reverse{to{transform:rotate(-360deg)}}@keyframes signal-flow{to{stroke-dashoffset:-64}}@keyframes node-breathe{0%,to{opacity:.58}50%{opacity:1}}@keyframes plane-drift{0%{transform:translateY(-3px)}to{transform:translateY(5px)}}@keyframes core-breathe{0%,to{transform:scale(.96);opacity:.82}50%{transform:scale(1.06);opacity:1}}@keyframes transition-field{0%,25%,35%,58%,68%,91%,to{opacity:0;stroke-dashoffset:180}28%,31%,62%,65%,94%,97%{opacity:.72;stroke-dashoffset:0}}@keyframes rail-flight{0%,26%,to{opacity:1}31%,95%{opacity:.18}}@keyframes rail-signal{0%,27%,65%,to{opacity:.18}33%,59%{opacity:1}}@keyframes rail-spatial{0%,60%,98%,to{opacity:.18}67%,92%{opacity:1}}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.muted{fill:#656d76}.micro{font-size:9px;letter-spacing:2.1px;font-weight:600}.tiny{font-size:8px;letter-spacing:1.45px}.label{font-size:11px;letter-spacing:1.4px;font-weight:600}.title{font-size:61px;letter-spacing:-3.8px;font-weight:550}.subtitle{font-size:15px;letter-spacing:-.2px}.mode{transform-box:view-box;transform-origin:center;will-change:opacity,transform}.mode-flight{animation:flight-state 12s ease-in-out infinite}.mode-signal{animation:signal-state 12s ease-in-out infinite}.mode-spatial{animation:spatial-state 12s ease-in-out infinite}.flight-orbit,.flight-orbit-reverse{transform-origin:700px 224px;animation:orbit 12s linear infinite}.flight-orbit-reverse{animation:orbit-reverse 12s linear infinite}.signal-path{stroke-dasharray:5 11;animation:signal-flow 2.4s linear infinite}.signal-node{animation:node-breathe 2.8s ease-in-out infinite}.spatial-plane{animation:plane-drift 3.4s ease-in-out infinite alternate}.core-breathe{transform-origin:700px 224px;animation:core-breathe 4s ease-in-out infinite}.transition-field{animation:transition-field 12s ease-in-out infinite}.rail-flight{animation:rail-flight 12s ease-in-out infinite}.rail-signal{animation:rail-signal 12s ease-in-out infinite}.rail-spatial{animation:rail-spatial 12s ease-in-out infinite}</style><defs><radialGradient id="hero-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0969da" stop-opacity=".22"/><stop offset=".48" stop-color="#6e40c9" stop-opacity=".08"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient><linearGradient id="hero-spectrum" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0969da"/><stop offset=".5" stop-color="#6e40c9"/><stop offset="1" stop-color="#1a7f64"/></linearGradient><filter id="hero-soft-glow" width="260%" height="260%" x="-80%" y="-80%"><feGaussianBlur result="blur" stdDeviation="7"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g opacity=".48"><path stroke="#eaeef2" d="M430 54v340" opacity=".55"/><path stroke="#eaeef2" d="M468 54v340" opacity=".34"/><path stroke="#eaeef2" d="M506 54v340" opacity=".55"/><path stroke="#eaeef2" d="M544 54v340" opacity=".34"/><path stroke="#eaeef2" d="M582 54v